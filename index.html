    const POEM_META = {"author_bios": {"李白": "字太白，號青蓮居士，盛唐偉大的浪漫主義詩人，後世尊為「詩仙」。其詩風雄奇豪放，想像豐富瑰麗，善於運用神話與誇張手法，意境超凡脫俗，與杜甫並稱「李杜」，為中國古典詩歌藝術之巔峰象徵。", "杜甫": "字子美，自號少陵野老，盛唐轉中唐偉大的現實主義詩人，後世尊為「詩聖」，其作品被譽為「詩史」。其詩沈鬱頓挫、對仗嚴整，充滿仁者愛人、憂國憂民的崇高胸懷。", "王維": "字摩詰，號摩詰居士，盛唐著名山水田園詩人、畫家，官至尚書右丞，世稱「王右丞」，後世尊為「詩佛」。其詩多以空靈山水與禪宗悟境為題，蘇軾盛讚其「詩中有畫，畫中有詩」。", "白居易": "字樂天，號香山居士，中唐著名現實主義詩人，世稱「詩魔」或「詩王」。主張「文章合為時而著，歌詩合為事而作」，與元稹共同倡導新樂府運動，語言平易通俗、老嫗能解。", "蘇軾": "字子瞻，號東坡居士，北宋著名文學家、政治家、書畫家，唐宋八大家之一，豪放詞派宗師。其文汪洋恣肆，其詩豪邁超逸，其詞開拓千古意境，兼具深邃哲思與豁達灑脫的人生境界。", "辛棄疾": "字幼安，號稼軒，南宋著名豪放派詞人、愛國將領，與蘇軾並稱「蘇辛」。其詞題材廣闊，充滿收復失地的壯烈情懷與悲憤沈痛，意象雄偉磅礡，風格沉雄豪邁。", "陶淵明": "名潛，字元亮，私諡靖節，自號五柳先生，東晉至南朝宋初偉大文學家，被尊為「古今隱逸詩人之宗」及「田園詩派之祖」。其詩文崇尚自然、不慕名利，真率恬淡而意蘊悠長。", "孟郊": "字東野，中唐著名詩人，與賈島齊名，世稱「郊寒島瘦」。其作詩刻意苦吟、琢句造語奇峭，善於描摹世態人情與母愛深恩，名作〈遊子吟〉傳頌千古。", "孟浩然": "襄州襄陽人，盛唐著名山水田園詩人，世稱「孟襄陽」。與王維並稱「王孟」。一生布衣隱居，其詩清淡雅致、超妙自然，極富藝術情韻。", "杜牧": "字牧之，號樊川居士，晚唐傑出詩人、散文家，與李商隱齊名並稱「小李杜」。其詩雄姿英發、俊爽飄逸，善於詠史抒懷，兼具深厚政見與風流才情。", "李商隱": "字義山，號玉谿生，晚唐著名詩人。其詩構思奇巧、辭藻華美，善於營造朦朧深邃之意境，尤以無題詩與七言律絕著稱，藝術成就極高。", "王之渙": "字季凌，盛唐著名邊塞詩人，晉陽人。性格豪邁大氣，常與高適、王昌齡等詩人交遊唱和。其詩氣勢磅礡、意境高遠，傳世之作雖不多，但〈登鸛雀樓〉與〈涼州詞〉皆為唐代絕句中之千古神品。", "王安石": "字介甫，號半山，北宋著名政治家、思想家、文學家，唐宋八大家之一。其詩雄健峭拔，晚年退居金陵後，詩風轉向精練雅麗、含蓄深邃，被譽為「王荊公體」。", "賈島": "字浪仙，中唐著名苦吟詩人，世稱「詩奴」。早年為僧，後還俗。為人清修孤苦，寫詩講究字斟句酌，「推敲」典故即源於其煉字之執著。", "劉禹錫": "字夢得，中唐著名詩人、哲學家，世稱「詩豪」。其詩風雄渾豪邁，充滿昂揚向上之哲理思辨，與白居易齊名，合稱「劉白」。", "王昌齡": "字少伯，盛唐著名邊塞詩人，世稱「王龍標」，後世尊其為「七絕聖手」或「詩家天子」。其七絕雄渾深邃、含蓄悠遠，邊塞與閨怨詩尤具代表性。", "韓愈": "字退之，自稱郡望昌黎，世稱「韓昌黎」，中唐古文運動倡導者，唐宋八大家之首，被蘇軾譽為「文起八代之衰」。其詩雄奇拔俗、力求創新。", "柳宗元": "字子厚，世稱「柳河東」，唐代傑出文學家、思想家，唐宋八大家之一。其山水遊記與寓言造詣極深，詩風清冷幽邃、托意遙深。", "李紳": "字公垂，中唐詩人、政治家，與白居易、元稹共同提倡新樂府運動。其早期所作〈憫農二首〉深刻揭示農民疾苦，傳頌千古。", "駱賓王": "字觀光，初唐著名詩人，初唐四傑之一。七歲即能詠鵝，文采出眾。隨徐敬業起兵反對武則天，所作〈討武曌檄〉名震天下。", "劉長卿": "字文房，中唐詩人，擅長五言詩，自詡為「五言長城」。其詩多寫山水風景與遷客失意之感，意境幽淡寒涼。", "王建": "字仲初，中唐著名現實主義詩人。其宮詞與樂府詩深入體察民間疾苦與閨闈世態，語言通俗自然，富於生活氣息。", "太上隱者": "唐代終南山著名隱士，姓名與生卒年皆不可考。自稱「太上隱者」，詩風返璞歸真、超然物外。", "蓋嘉運": "盛唐將領，官至開府儀同三司，曾任西節度使。此詩題為其改編創作之邊塞歌曲。", "漢樂府": "漢代掌管音樂的官署（樂府）所採集記錄的民間歌謠與文人創作。其作品質樸生動，反映現實生活，為中國敘事詩發展奠定重要基礎。", "韋應物": "京兆萬年人，中唐著名山水田園詩人。早年任俠，後折節讀書為官。其詩風格高雅閑淡，與王維、孟浩然、柳宗元並稱「王孟韋柳」。", "盧綸": "字允言，中唐詩人，「大曆十才子」之一。其邊塞詩氣勢磅礡、豪邁剛健，尤以〈塞下曲〉組詩最為膾炙人口。", "雍裕之": "字濟之，中唐詩人。詩風清新雅潤，觀察自然細膩傳神。", "西鄙人": "唐代西北邊陲民間無名作者之總稱。「鄙」指邊遠之地。該首民謠真摯反映西北軍民崇敬名將哥舒翰之深情。", "黃巢": "曹州冤句人，唐末農民起義領袖。少有才名，屢試不第，所作賦菊詩豪氣干雲，充滿沖天豪邁之英雄氣魄。", "曹植": "字子建，三國魏著名文學家，曹操第三子。才高八斗，建安文學集大成者，被謝靈運稱讚「天下才有一石，曹子建獨得八斗」。", "陳子昂": "字伯玉，初唐文學家、詩歌革新先驅。力反六朝綺靡詩風，倡導漢魏風骨與復古興寄，開盛唐詩歌磅礡氣象。", "杜秋娘": "唐代金陵人，著名歌妓、詩人，曾為鎮海節度使李錡妾，後入宮受憲宗寵幸。以清婉深情的勸學詩〈金縷衣〉流芳百世。", "宋之問": "字延清，初唐著名詩人，與沈佺期齊名，世稱「沈宋」。對五言、七言近體律詩格律之定型奠定卓越貢獻。", "王翰": "字子羽，盛唐著名邊塞詩人。性格豪爽浪漫、縱情聲色，其作〈涼州詞〉意境雄健豪放，為邊塞詩千古絕唱。", "岑參": "盛唐著名邊塞詩人，世稱「岑嘉州」，與高適並稱「高岑」。兩度出塞，詩中描繪邊疆壯麗風光與將士昂揚士氣，奇偉豪放。", "李益": "字君虞，中唐著名邊塞詩人，世稱「李公佐」。其七絕長於描摹邊塞征人的鄉思愁緒與大漠邊關風貌，情韻深婉。", "韓翃": "字君平，中唐「大曆十才子」之一。詩風輕巧流麗，以〈寒食〉詩「春城無處不飛花」獲唐德宗賞識而晉升中書舍人。", "僧志南": "南宋詩僧，名志南（原手冊作僧志安）。善為詩，朱熹曾為其詩評點，其名作「沾衣欲濕杏花雨」廣為傳頌。", "鄭準": "中唐詩人。其作品清麗靈動，觀察自然景物生動入微。", "高駢": "字千里，晚唐名將、詩人。文武雙全，其山水景物詩工整清新，筆觸明麗。", "朱熹": "字元晦，號晦庵，南宋著名哲學家、理學家、教育家，宋代理學集大成者。其詩富於人生哲理與讀書治學心得。", "張九齡": "字子壽，韶州曲江人，盛唐開元賢相、文學家，世稱「張曲江」。其詩清雅高標、情致溫潤，開盛唐清新詩風。", "劉方平": "中唐詩人。詩風幽婉深秀，善於捕捉春夜微細風光與闺中思緒。", "張繼": "字懿孫，中唐詩人。天寶進士，所作〈楓橋夜泊〉以一鐘之聲點染客船霜夜愁思，使蘇州寒山寺千古名揚天下。", "顏真卿": "字清臣，京兆萬年人，唐代著名政治家、抗安史名臣、書法四大家之一（顏體開創者）。其人忠肝義膽，作詩重教化與勉勵。", "錢福": "字與謙，號鶴灘，明代弘治三年狀元。詩文敏捷豪爽，其〈明日歌〉警策後世莫空度光陰，膾炙人口。", "李煜": "字重光，初名從嘉，號鍾隱、蓮峰居士，南唐末代國君，世稱「南唐後主」、「詞中之帝」。亡國入宋後，詞風由輕艷轉為血淚沈痛，感天動地。", "崔顥": "汴州人，盛唐著名詩人。所作〈黃鶴樓〉氣度宏大、神韻超凡，傳聞李白登黃鶴樓讀之，亦歎「眼前有景道不得，崔顥題詩在上頭」。", "韋莊": "字端己，晚唐五代花間派詞人代表，與溫庭筠並稱「溫韋」。其詞風格清麗疏朗、情致哀傷，工於敘事與抒情。", "馬致遠": "號東籬，元代著名戲曲家、散曲家，與關漢卿、白樸、鄭光祖並稱「元曲四大家」，被尊為「曲狀元」。其小令意境深遠空靈。", "歐陽修": "字永叔，號醉翁、六一居士，北宋政治家、文學家，北宋詩文革新領袖，唐宋八大家之一。其詞委婉含蓄、清麗自然。", "晏殊": "字同叔，北宋政治家、文學家，十四歲賜同進士出身。其詞語言純粹溫潤、音律諧婉，承五代南唐遺風，開北宋詞壇先聲。", "楊慎": "字用修，號升庵，明代著名文學家、學者，明代正德六年狀元。學問廣博，所作〈臨江仙〉被清代毛宗崗選為《三國演義》卷首詞，名揚四海。"}, "poem_explanations": {"送柳淳": {"trans": "翠綠青山面臨著奔騰黃河，山腳下橫臥著通往長安的驛道。世上追逐功名利祿的人們熙來攘往，只顧奔波忙碌，連自己容顏衰老都不曾察覺。", "explain": "孟郊借長安古道上名利之客的匆忙身影，對世俗奔波給予深刻的警醒與反思，意境深遠，格調高古。"}, "夜思": {"trans": "明亮的月光灑在床鋪之前，恍惚間像是在地上凝結了一層白霜。我禁不住抬起頭遙望夜空中的明月，又低下頭深深思念起遠方的故鄉。", "explain": "李白最傳誦的思鄉名篇。以極其質樸平實的語言，傳神寫出遊子深夜忽見明月時那份最真摯、最純粹的鄉愁。"}, "憫農": {"trans": "農夫在正午炎炎烈日下耕耘鋤草，滴滴汗水滲入了禾苗生長的泥土中。有誰能體會這盛在飯碗裡的美味米飯，每一顆都是農民辛勤勞動的結晶呢！", "explain": "深刻反映農人稼穡之艱難苦痛，結句「誰知盤中飧，粒粒皆辛苦」成為千百年來世人愛惜糧食、感懷勞作的至理名言。"}, "秋浦歌": {"trans": "滿頭白髮長達三千多丈，只因胸中的離愁別緒就是這般的深長綿延。若不是看著明鏡中的倒影，哪裡能知道自己何時染上了這滿頭深秋的白霜！", "explain": "李白巧妙運用極致的誇張藝術，把內心無邊無際的愁緒具象化為三千丈白髮，浪漫奇絕，震撼人心。"}, "尋隱者不遇": {"trans": "在蒼翠松樹下向小童子詢問先生的去向，童子回答說：『師父已經採藥去了；他就在這座大山之中，只是山中雲霧繚繞，我也不知道他身在何處。』", "explain": "賈島以三番問答入詩，言簡意賅，將尋訪不遇之惆悵轉化為對隱者高潔空靈情操的無限嚮往。"}, "竹里館": {"trans": "我獨自端坐在幽靜青翠的竹林深處，一邊彈弄著古琴，一邊引吭長嘯。在這深林之中沒有世人知曉我的雅趣，只有夜空中的一輪明月穿透竹影，溫柔相照。", "explain": "王維山水田園詩之代表作。以琴聲、長嘯與明月相伴，傳達出詩人安詳澄澈、超塵絕俗的高雅禪趣。"}, "送別": {"trans": "在幽靜山林中送別了摯友，夕陽西下，我默默掩上柴門。春草到了明年依然會青翠茂密，但不知遠遊的王孫好友，那時究竟歸不歸來呢？", "explain": "全詩含蓄溫婉，將送友之後的悵惘寄託於門掩夕陽與萋萋春草之中，餘韻無窮。"}, "江雪": {"trans": "重重群山之中群鳥都已飛盡無蹤，條條小路上也不見任何人的腳印痕跡。只有一葉孤舟上一位披蓑戴笠的老翁，冒著滿天風雪，獨自垂釣這寒冷江波。", "explain": "柳宗元被貶永州時所作。以萬籟俱寂的冰雪天地為襯托，刻畫出孤高拔俗、百折不撓的精神人格像。"}, "登鸛雀樓": {"trans": "夕陽依傍著西山漸漸沉落，奔騰的黃河滾滾向東海奔流。若是想要看盡千里之外更加壯麗的風光，那就必須再登上一層樓！", "explain": "王之渙將雄渾壯闊的自然寫景與積極進取的人生哲理完美融為一體，展現盛唐昂揚向上的博大胸懷。"}, "雜詩": {"trans": "您剛從我們的故鄉遠道而來，一定知曉故鄉發生的種種事情吧！請問您動身啟程的那天，我家雕花窗前的那株寒梅，開花了沒有呢？", "explain": "王維不問天下大事，獨扣寒梅著花未，以微小細節傳達出遊子對家鄉極其深切細膩的依戀之情。"}, "在軍登城樓": {"trans": "登上城樓，只覺高風陣陣寒意凜冽；滾滾江水之上瀰漫著冰冷水氣。不知這軍營戎裝何時才能平定戰火脫下，讓我們踏著歡慶歌舞重返繁華長安！", "explain": "駱賓王隨軍征戍之時登樓有感，既寫邊地之苦寒肅殺，更流露渴望戰亂早息、天下太平之熱切祈盼。"}, "春曉": {"trans": "春日清晨睡得十分香甜香美，不知不覺天就亮了，到處都能聽見鳥兒歡快的啼鳴聲。回想起昨夜風雨交加的聲響，不知那些美麗的花朵被打落了多少呢！", "explain": "孟浩然隨性擷取春晨生活片斷，寫出對明媚春光的由衷欣喜與愛花惜春之純真情懷，自然流暢無比。"}, "相思": {"trans": "晶瑩鮮紅的紅豆生長在溫暖的南方，不知在春風中又萌發長出了幾多枝條？希望好友您能夠多多採擷一些，因為這種紅豆正是最能寄託相思深情的信物啊！", "explain": "王維借南方紅豆詠歎友情與眷戀，語調溫潤優雅，寄意深微，成為中華相思文化最經典之代名詞。"}, "答人": {"trans": "偶爾信步漫步來到青松樹下，便悠閒地枕著白石安然入睡。這深山之中遠離塵囂沒有日曆可查，每當寒冬過盡，我甚至不知道人間又翻過了哪一年。", "explain": "詩意極具道家超脫與出世境界，展現擺脫名利拘束、與山林日月合而為一的真純自由。"}, "獨坐敬亭山": {"trans": "成群的鳥兒高飛遠去直到無影無蹤，天際的一抹孤雲也獨自自在悠閒飄散。天地之間我與這敬亭山久久相對而互不厭倦，唯有敬亭山能夠完全理解我李白的孤傲胸懷！", "explain": "李白晚年漂泊孤寂時所作。以擬人手法將敬亭山化為靈犀相通之知己，透射出超凡出塵的傲骨與孤獨之美。"}, "彈琴": {"trans": "清脆悠揚的琴音在七根琴絃上流淌，靜靜聆聽有如松林寒風呼嘯般的清冽。這種古樸雅正的高古調子雖然自我深愛，可惜當今世上的人們大多早已不再彈奏了。", "explain": "劉長卿借古調不再流行寄寓知音難覓的感傷，借琴聲寄託自身不同流合污、潔身自好之高尚操守。"}, "夜宿山寺": {"trans": "這座高聳入雲的古寺樓臺高達百丈，彷彿一伸手就能摘下夜空璀璨的星辰。站在高處我不敢大聲說話，生怕驚擾了九天之上的神仙！", "explain": "李白以童心未泯的奇特遐想與誇張手法，生動再現山頂寺院高插雲霄的非凡氣勢。"}, "新嫁娘": {"trans": "新婚過後第三天走進廚房，洗淨雙手親自做羹湯。因為還不熟悉婆婆平日的口味習慣，便先請小姑子先品嘗一勺看看合不合適。", "explain": "王建截取新娘初入夫家的微妙心理與生活細節，刻畫了一位聰敏、溫順、謹慎操持家務的古代新娘形象。"}, "怨情": {"trans": "美麗的女子輕輕捲起珍珠簾幕，獨自坐在深閨之中緊蹙著纖秀雙眉。只見她白皙臉龐上滿是晶瑩的淚痕，卻不知她心中究竟在怨恨思念著誰呢？", "explain": "李白以白描筆法勾勒閨中幽怨美人的情態，留白深長，言有盡而意無窮。"}, "伊州歌": {"trans": "快快打落樹頭歡鳴的黃鶯兒吧，莫要任由牠在枝頭啼叫不休！牠的啼鳴驚擾了我的好夢，讓我無法在夢中飛到遙遠的遼西與征戰的夫君相聚！", "explain": "全詩巧用逆向構思，把對遠方征夫的刻骨相思化作對黃鶯啼鳴的嬌嗔責怪，情感真切動人。"}, "池上": {"trans": "天真可愛的小孩童獨自撐著一隻小舟，悄悄採下白蓮花歡喜帶回。孩童不懂得隱藏自己的行蹤，池塘中的浮萍早已被小艇劃開成了一道長長的碧痕！", "explain": "白居易以無比溫柔的筆調捕捉孩童的天真爛漫與稚氣淘氣，如同一幅栩栩如生的水墨江南童趣圖。"}, "江南": {"trans": "江南水鄉正是採蓮的美好季節，碧綠的蓮葉多麼茂盛舒展啊！魚兒在蓮葉間嬉戲穿梭：一會兒游到東面，一會兒游到西面，一會兒游到南面，一會兒游到北面。", "explain": "漢樂府最具代表性的抒情歌謠。複沓句法宛如歡快跳躍的音符，生動呈現江南採蓮男女勞作時的蓬勃生機。"}, "送陸判官往琵琶峽": {"trans": "在這水鄉秋風肅殺的夜晚，實在不是我們這般好友遠道惜別的時刻。長安城如同一場遙遠的夢境，究竟何時才是我們歸鄉相聚的佳期呢？", "explain": "李白送別友人之作，融秋江客愁與長安故園之思於一爐，蒼涼深摯。"}, "秋夜寄邱員外": {"trans": "我思念遠方的您正值這清冷的秋夜，獨自漫步長吟在這涼爽的天地間。空寂山林中松子紛紛掉落，我想幽居遠方的隱逸好友您，此時也該尚未入眠吧！", "explain": "韋應物以清朗疏淡之景抒發對老友的深沉憶念，松子落山之空靈動靜，盡顯山水名家之化境。"}, "玉階怨": {"trans": "白玉石階上早已凝結起清冷的秋露，長久伫立夜風悄然侵濕了薄薄的羅襪。無奈地放下晶瑩如水的水晶珠簾，隔著簾瓏凝望夜空中那一輪皎潔秋月。", "explain": "李白無一「怨」字而字字含怨，以白露浸襪、卻簾望月之細膩舉動，傳神刻畫宮人無邊落寞。"}, "塞下曲": {"trans": "夜色漆黑一群大雁驚恐飛高，原來是敵軍單于趁夜倉皇逃跑。將軍正要率領輕捷騎兵飛馳追擊，紛飛的鵝毛大雪已落滿了弓箭與鋼刀！", "explain": "盧綸邊塞名篇。大雪滿弓刀的雄壯畫面，定格了唐代邊防將士英勇威武、嚴陣以待的豪邁氣概。"}, "登樂遊原": {"trans": "傍晚時分心情略感不適，便驅車登上長安城外的樂遊原。夕陽晚照無限美好壯麗，只可惜天色已經接近黃昏落幕了。", "explain": "李商隱登高攬勝有感。既讚歎夕陽餘暉之絕美，又深藏盛唐繁華不再、日薄西山之深層歷史滄桑感。"}, "鹿柴": {"trans": "空曠寂靜的山中看不見一個人影，只能隱隱聽見遠處傳來若有若無的人語回聲。夕陽的餘暉穿透密林深處，又重新返照在綠茸茸的青苔之上。", "explain": "王維將「空山」之幽、「返景」之明結合，以聲襯靜、以光破暗，達到禪意與自然交融之至高造詣。"}, "劍客": {"trans": "十年辛苦磨礪鍛造這一柄寶劍，吹毛立斷的霜雪利刃至今尚未曾試鋒芒。今天特地將此寶劍展現給您看，世間若有不公不平之事，我願仗劍相平！", "explain": "賈島借詠劍自抒抱負，表現俠肝義膽與滿懷才華渴望為國為民效力的浩然正氣。"}, "問劉十九": {"trans": "新釀成未濾的米酒泛著綠色細微泡沫，紅泥塗抹的小火爐正燒得溫暖紅旺。天色向晚天空中似乎正要飄起初雪，能來寒舍共飲這杯暖酒嗎？", "explain": "白居易晚年名篇。透過火爐、新酒與晚雪營造出無比溫馨親切的家庭氛圍，友誼純真醉人。"}, "四氣": {"trans": "春天鳥兒還在啼鳴競相婉轉，夏日樹木忽已交織成濃密濃蔭。不知不覺秋山已漸行漸遠，俄頃之間又驚覺冬日霰雪已深厚降臨。", "explain": "雍裕之以寥寥二十字概括春夏秋冬四時流轉，感歎光陰飛逝如白駒過隙，意蘊警策。"}, "哥舒歌": {"trans": "北斗七星高懸在塞外天際，大將軍哥舒翰深夜仍佩帶寶刀巡營。直到如今敵軍騎兵只敢在遠處窺伺戰馬，再也不敢越過邊防重鎮臨洮！", "explain": "西北邊民讚頌哥舒翰威震邊陲的豪邁民歌，節奏剛勁昂揚，流露真摯的愛戴之情。"}, "梅花": {"trans": "在牆角避風處生長著幾株寒梅，冒著嚴寒獨自迎風盛開。遠遠望去便知道那晶瑩純白不是積雪，因為正有幽雅的暗香隱隱隨風襲來。", "explain": "王安石借凌寒傲雪之梅花自喻，象徵在艱險環境中堅持崇高理想、堅貞不屈的君子品格。"}, "不第後賦菊": {"trans": "等熬到了秋天九月八日重陽將至，我的菊花一旦盛開百花都將黯然凋零。那衝天的香氣將貫穿整座長安古都，滿城都將披掛上燦爛輝煌的黃金戰甲！", "explain": "黃巢屢試不第後所賦，氣魄凌雲、意象雄偉，隱含驚天動地的變革豪情與傲骨。"}, "七步詩": {"trans": "鍋底下燃燒著豆莖作為薪柴，鍋裡煮著的豆子在沸水中痛苦哀泣。我們原本就是同一根莖長出來的骨肉兄弟，今天為何要相殘相煎得如此緊迫狠心呢！", "explain": "曹植在生死逼迫下以豆萁煮豆為喻，詞鋒機敏沉痛，痛斥手足相殘之悲劇，感人肺腑。"}, "登幽州臺歌": {"trans": "往前看去見不到古代求賢若渴的聖賢明君，向後望去也看不到未來能理解我的明達之士。想到這天地是如此遼闊浩瀚永恆無窮，我獨自一人感到悲愴哀涼而禁不住淚水漣漣！", "explain": "陳子昂登臨薊北幽州臺，撫今追昔，唱出了千古士人懷才不遇、直面宇宙蒼茫之絕世孤獨悲歌。"}, "清明": {"trans": "清明時節細雨綿綿飄落不絕，行經途中的遊子心神淒迷欲斷魂。請問哪裡才能找到買酒驅寒歇息的小店呢？只見騎牛的牧童遙遙指向遠處盛開的杏花村。", "explain": "杜牧描寫清明節氣的千古絕唱。情景相生，將春雨惆悵與杏花村的明麗生機熔鑄為一體。"}, "花影": {"trans": "重重疊疊的花朵幽影攀爬到了玉臺之上，幾番叫僮僕拿掃帚去揮掃也無法將它掃除。剛被西下的太陽帶走收拾乾淨，卻又被剛剛升起的明月重新送了過來！", "explain": "蘇軾借揮之不去的花影設喻，既寫物象之趣，又寄寓世間小人讒言如影隨形、難以盡絕之諷喻。"}, "金縷衣": {"trans": "勸勉郎君莫要過度珍惜那華麗的名貴金縷衣，勸勉郎君應當萬分珍惜美好的青春韶華。鮮花盛開正合時宜之時就應當折取，切莫等到花兒落盡了才去枉折空空的枯枝！", "explain": "杜秋娘著名勸學感時之作，比喻精妙，情真意切，警惕世人把握當下韶光與奮進良機。"}, "渡漢江": {"trans": "流放嶺南多年音訊書信斷絕，歷經了寒冬又度過了春回大地。如今越是接近故鄉心情越發忐忑膽怯，甚至不敢主動開口向迎面而來的故鄉人詢問家裡的情況。", "explain": "宋之問寫流放歸途中「近鄉情更怯」之微妙心理，真切再現遊子久別重返時百感交集的恐懼與期待。"}, "遊子吟": {"trans": "慈愛的母親手中拿著針線，為即將遠行的遊子縫製身上的衣裳。臨行前密密麻麻地細細縫合，內心深處唯恐兒子此去經年遲遲難歸。有誰能說得清做兒女如寸草般微小的孝心，能夠報答得了母親那浩大如春日陽光的厚愛恩情呢！", "explain": "孟郊以至真至純之筆讚頌母愛，樸素無華卻撼動天地，為千百年來謳歌慈母之第一經典。"}, "涼州詞": {"trans": "黃河彷彿奔騰遠上白雲之端，那一座孤零零的邊防戍城矗立在萬仞高山之中。何必要用羌笛吹奏那幽怨傷感的《折楊柳》曲調呢，春天的春風原本就吹度不過這高高的玉門關啊！", "explain": "王之渙將邊塞黃河之雄闊蒼茫與戍邊將士遠隔春風之悲慨完美交織，格調高亢悲壯。"}, "早發白帝城": {"trans": "清晨告別了彩雲繚繞間高聳的白帝城，千里迢迢的江陵在一天之內就能乘舟歸返。長江兩岸猿猴悲啼的聲音還在耳邊不斷迴響，輕快的舟船早已穿過了萬座重重疊疊的青山！", "explain": "李白遇赦得釋東歸時之絕作，流瀉出驚人的速度感與喜獲新生的痛快淋漓，筆墨神采飛揚。"}, "長安秋望": {"trans": "樓閣高高聳立在覆霜樹林之外，清澈碧空萬里無雲澄澈無比。巍峨的終南山與明淨的秋光交相輝映，山色與秋色雄渾壯麗彼此競相拔高！", "explain": "杜牧登樓秋望，筆致高邁雄健，寫盡了秋日長安古都的廣闊乾坤與磅礡氣象。"}, "九月九日憶山東兄弟": {"trans": "我一人孤獨漂泊異鄉作為異客，每每遇到佳節良辰便加倍思念故鄉骨肉至親。遠遠推想家鄉的兄弟們今天也必定登高遠眺，在插滿茱萸之時定會感嘆唯獨少了我李白一人！", "explain": "王維十七歲客居長安時所作。以逆推設想對方思念自己的絕妙構思，寫盡佳節思親之痛徹肺腑。"}, "秋夕": {"trans": "銀白的燭光映照著冰冷的畫屏，宮女手拿著輕軟的羅絹小扇撲打著飛舞流螢。夜幕下天階的石板色澤微涼如水，無奈地倚臥遙遙凝望天河相望的牽牛織女二星。", "explain": "杜牧描寫失寵深宮宮女的淒清生活，情調清幽宛轉，流螢與星漢相襯，寄託無盡悵惘。"}, "赤壁": {"trans": "殘破的折斷鐵戟沉沒在江沙中歷經歲月尚未鏽蝕銷融，自己拿來重新磨洗依稀認出那是三國前朝的兵器。倘若當年周瑜未能借助有利的東風火燒戰船，那麼銅雀臺深處恐怕早已深鎖了東吳大喬小喬二位佳人了！", "explain": "杜牧借一件三國遺物翻出不落窠臼之歷史公案，諷喻英雄成敗之機遇與歷史之偶然性。"}, "飲湖上初晴後雨": {"trans": "晴朗的日子裡西湖波光蕩漾閃爍分外嬌好，下雨的時候山色空濛迷茫奇麗無比。如果要把這秀麗的西湖比作絕代佳人西施，那麼無論淡施脂粉還是濃施粉黛，都是那樣的合宜動人！", "explain": "蘇軾以西施比西湖，神來之筆流傳千古，「西子湖」雅號遂名揚天下，藝術構思精巧非凡。"}, "逢入京使": {"trans": "回頭遙望東方的故鄉道路漫漫漫長，思鄉的淚水止不住流淌打濕了雙袖龍鍾。在馬背上匆匆相逢身邊沒有紙墨筆硯，只能託付您回長安時替我口頭帶個信給家人報聲平安！", "explain": "岑參出塞途中偶遇回京使者，真情流露於匆促片刻，質樸親切，感染力經久不衰。"}, "江南逢李龜年": {"trans": "當年我在岐王王府的宴席裡常與您相見，在崔九堂前也曾無數次聆聽您的妙音。如今江南正是風景最美麗的春天，沒想到在這繁花飄零的遲暮歲月，竟又與您意外重逢！", "explain": "杜甫晚年名作。四句詩囊括開元盛世之繁華與安史之亂後之飄零，被譽為「一曲杜詩之絕唱」。"}, "登岳陽樓": {"trans": "很久以前便聽聞洞庭湖浩瀚之名，今日終於登上了岳陽樓頂。吳國楚國被這萬頃巨浪分割開來，整個乾坤天地彷彿都在湖水日夜浮動搖晃。戰亂中親朋故舊音訊全無，老病殘軀中只剩下一隻孤舟伴隨。邊關以北戰火烽煙依舊不絕，倚著欄杆我禁不住老淚縱橫長流！", "explain": "杜甫五言律詩巔峰之作，意境雄渾壯烈，個人老病之悲與國家山河之痛融為一體，感人至深。"}, "元日": {"trans": "在熱鬧的劈啪爆竹聲中舊的一年過去了，和煦的春風把暖意送入了新飲的屠蘇美酒之中。朝陽升起照耀著千家萬戶，人們紛紛把嶄新的桃符換下了門上的舊符。", "explain": "王安石描繪宋代春節除舊佈新的喜慶生機，洋溢樂觀進取的政治抱負與生機勃勃的氣象。"}, "濟源寒食-其五": {"trans": "長安城裡的落花被狂風捲得飛入雲霄，順著溫暖南風徑直飄到了天子前殿。可憐這春意盎然的萬物還知道去朝見君王，唯有我一人孤獨在渭水邊痛苦沉吟。", "explain": "孟郊借寒食落花諷刺世俗爭名逐利，抒發自己懷才不遇、淪落天涯之憤懣孤清。"}, "八陣圖": {"trans": "名震天下的諸葛亮輔佐劉備，功績雄蓋了三分天下的蜀漢；創製出深奧莫測的八陣圖，使名聲千秋永垂。長江滔滔江水終究衝不轉灘頭堅立的石堆陣法，令人遺恨萬分的是劉備未能聽從勸諫吞併東吳！", "explain": "杜甫登臨峽江八陣圖遺址，緬懷諸葛孔明的豐功偉績與悲劇遺恨，詞意沉鬱跌宕。"}, "賈生": {"trans": "漢文帝求賢若渴特地宣召貶謫之臣賈誼入宮，賈生的卓絕才華在當世無人可比。令人歎息的是文帝半夜促膝深談甚至身移前席，竟然不向賈生詢問天下蒼生疾苦，反而只是一味打聽鬼神迷信！", "explain": "李商隱藉漢文帝訪賈誼詠史諷今，抨擊晚唐帝王沉溺求仙鬼神而不顧國計民生，諷刺深刻入骨。"}, "山行": {"trans": "順著高聳寒山間迂迴曲折的石板小徑向上攀登，在白雲繚繞縹緲的深處隱隱住著幾戶人家。停下車馬只因喜愛這楓林傍晚的瑰麗景色，那經霜的秋楓紅得勝過了二月嬌艷春花！", "explain": "杜牧反轉傳統傷春悲秋之套路，熱情讚頌深秋楓葉經霜尤艷之頑強生機，意境高遠爽朗。"}, "夜上受降城聞笛": {"trans": "回樂峰前的黃沙白茫茫宛如冬雪，受降城外的夜月慘澹清涼正如重霜。不知在城外何處隱隱吹響了淒涼的蘆管羌笛，惹得這一夜的所有遠征將士全都望向故鄉！", "explain": "李益以如雪如霜的邊關冷月與穿透夜空的笛聲，極力渲染邊塞將士徹骨的思鄉之痛。"}, "寒食": {"trans": "春日京城長安處處飛舞著繽紛落花，寒食節的東風輕輕拂過御花園中的楊柳斜倚。夜幕降臨時漢宮禁苑特賜權臣蠟燭分發，輕柔的青煙飄散進入了五侯王孫貴胄之家。", "explain": "韓翃以工麗筆調描摹長安春景與宮闈特權，表面承平綺麗，內蘊微言大義之諷刺諷喻。"}, "絕句": {"trans": "兩隻黃鸝在翠綠的楊柳枝頭清脆鳴叫，一行白鷺展翅飛向高遠蔚藍的青天。憑窗遠眺可望見西嶺積雪覆蓋的千年雪山，門口水路上停泊著準備啟程航往萬里之外東吳的客船。", "explain": "杜甫浣花溪草堂名作。四句詩勾勒出四幅色彩明麗、對仗極其工整之錦繡春景，格局雄闊大氣。"}, "雲": {"trans": "一朵朵白雲飄飛而來安靜而自在，剛登上樓頭轉眼又翻越到了後山之前。在晴空中整日飄零也不曾散去回返，就這樣點綴貼破了那萬里澄澈明淨的碧空晴光。", "explain": "鄭準以敏銳生動的筆觸賦寫白雲游弋，將閒雲野鶴般的空靈情致描摹得妙趣橫生。"}, "山居夏日": {"trans": "綠樹茂密林蔭深濃夏日的白晝特別漫長，精美的樓臺在清澈池塘中投下秀麗的倒影。微風吹拂水晶簾幕輕輕搖曳晃動，滿架盛開的薔薇花散發出一整個庭院的馥郁芬芳！", "explain": "高駢以明麗優雅的筆觸描摹初夏山居景緻，動靜相生，色香味俱佳，令人心曠神怡。"}, "憶江上吳處士": {"trans": "您揚起風帆遠赴閩地，夜空中的月輪已幾番圓缺變化。秋風蕭瑟吹拂著渭水之波，紛飛的落葉落滿了整個長安。當年我們在此歡聚一堂的傍晚，雷雨交加寒意逼人。如今您的蘭木舟楫仍未歸來，唯有微渺的音信隱沒在渺茫的海雲之端！", "explain": "賈島「秋風吹渭水，落葉滿長安」為千古傳頌名句，融情入景，營造出高古清寒、無盡相思之意境。"}, "贈劉景文": {"trans": "荷花落盡再也沒有那如同高擎著遮雨的翠綠荷蓋，菊花凋謝依然傲立著不畏霜寒的剛勁傲骨。一年之中最美好難忘的景緻您一定要牢牢記取，那就是金橙燦黃、綠橘正香的金秋時節！", "explain": "蘇軾勉勵好友劉景文之作。借傲霜之菊與橙黃橘綠，比喻人應當珍惜晚年才智、保持堅貞操守。"}, "嫦娥": {"trans": "雲母鑲嵌的精美屏風深處燭影搖曳，天際的銀河漸漸西落啟明星正逐漸沉沒。廣寒宮中的嫦娥此時此刻應當無比後悔偷吃了長生不老的仙藥吧，落得在這無垠的碧海青天之中夜夜孤寂淒寒！", "explain": "李商隱借神話寄託求仙無著、知音難遇的心靈孤絕，語言精緻瑰麗，情感深沉淒迷。"}, "山居秋暝": {"trans": "空曠的山林刚刚迎來一場秋雨洗禮，傍晚時分涼意襲人帶來秋天的清爽氣息。皎潔的明月穿透松林枝葉灑落柔光，清冽的泉水在溪石之上淙淙流淌。竹林深處傳來浣紗歸來村女的歡聲笑語，蓮葉搖擺擺動原來是順流而下的漁船。任憑春天的芳草隨風枯萎歇息，秋山如此純美純潔，隱者王孫自可久久留居！", "explain": "王維山水田園詩之壓卷之作，動靜交輝、有聲有色，把高潔情操與隱居之樂描繪得如仙境畫卷。"}, "勸學詩": {"trans": "青春年少很容易轉瞬老去而學問卻極其難以成就，縱使是一寸短短的光陰也千萬不可以輕忽浪費。池塘邊春草如茵的美夢尚未完全驚醒，石階前梧桐落葉已然傳來了深秋肅殺的風聲！", "explain": "朱熹勸勉後生晚輩當惜時如金、勤勉求學，比喻生動警策，具有深遠的教育激勵意義。"}, "芙蓉樓送辛漸": {"trans": "迷濛的冷雨連綿漫江在深夜灑入了吳地，清晨送別摯友唯見楚山一抹孤傲聳立。到了洛陽如果親朋好友詢問起我王昌齡的近況，就請您告訴大家：我依然保持著一片純潔晶瑩如玉壺之冰心！", "explain": "王昌齡以「一片冰心在玉壺」明志，展現即使身處逆境貶謫之中，依然不染塵俗、光明磊落的高風亮節。"}, "子夜四時歌-春歌": {"trans": "秦地美麗的羅敷女子，在清澈的綠水之畔採摘著柔桑。潔白如雪的素手拂過青翠柔軟的枝條，臉上淡抹的紅妝在明媚春日下分外嬌艷。蠶兒飢餓了妾身必須趕快歸去，路過騎乘五馬的貴人們切莫在此流連不走！", "explain": "李白借古代樂府民歌古題，塑造了一位勤勞端莊、自尊自愛的江南蠶桑少女形象。"}, "子夜四時歌-夏歌": {"trans": "廣闊的鏡湖綿延三百里之遠，池中菡萏正怒放著嬌艷的荷花。五月裡越女西施在此採摘蓮花，圍觀觀賞的遊人擠滿了小小的若耶溪。她急忙泛舟歸去不等到月光升起，早早回到了越王的宮中。", "explain": "李白描寫若耶溪夏日採蓮與西施傳奇，意境明媚活潑，充滿浪漫縹緲的吳越風情。"}, "子夜四時歌-秋歌": {"trans": "長安古都籠罩在無垠澄澈的秋月之下，千家萬戶傳來了婦人為征夫趕製冬衣的陣陣砧杵之聲。那秋風吹拂吹之不盡，每一陣風裡都盛滿了對遠在玉門關征夫的刻骨思念。究竟到了哪一天才能徹底平定邊患胡虜，好讓我的夫君早日結束這漫長的遠征呢！", "explain": "李白名篇。萬戶擣衣之聲化為思婦共同之心聲，融家國安危與兒女柔情於一爐，博大深沉。"}, "子夜四時歌-冬歌": {"trans": "明天一早邊關驛使就要動身出發，妻子徹夜不眠加緊為征夫絮好保暖的寒袍。凍僵的素手抽動著冰冷的鐵針，哪裡還能禁受得住那冰冷剪刀的寒刺。將這縫製好的冬衣寄往遙遠邊疆，不知何日才能送達到那苦寒的臨洮邊關啊！", "explain": "李白生動再現寒冬深夜思婦趕製棉衣的深情，體貼入微，催人淚下。"}, "金鄉送韋八之西京": {"trans": "好友您從繁華長安遠道而來，如今又要動身重回長安故都。那呼嘯的狂風牽動著我深切的心緒，彷彿一路隨您向西高高懸掛在咸陽古樹之上。這份真摯離情難以用言語盡情表達，此番分別不知何年何月才能再度相遇。我極目遠眺已看不見您的身影，唯見重重疊疊的青山升起了蒼茫的煙霧！", "explain": "李白「狂風吹我心，西掛咸陽樹」以奇特瑰麗之想像抒發離思，豪氣之中飽含深情。"}, "觀書有感": {"trans": "半畝見方的小池塘如同展開了一面晶瑩明鏡，天上燦爛的陽光與潔白的雲影一同在水面徘徊倒映。請問這池塘為何能夠保持得如此清澈潔淨呢？只因為源頭一直有源源不絕的清澈活水不斷注入流淌進來啊！", "explain": "朱熹將治學讀書之深奧哲理寄託於池塘活水之生動比喻，寓意人唯有不斷吸納新知識方能思維常新。"}, "終南別業": {"trans": "人到了中年以後特別崇尚修道求真，晚年時便把家安置在了終南山的山腳之畔。興致來時常常獨自一人悠閒漫步，其中的種種妙趣唯有自己心中暗暗知曉。信步漫行不知不覺走到了溪水的源頭盡處，便索性坐下來靜靜觀看白雲悠悠升起。偶然在山林中遇到砍柴的老翁，便與他相伴談笑風生而忘記了歸去的時辰。", "explain": "王維晚年自得禪趣之名篇，「行到水窮處，坐看雲起時」成為無數文人達觀處世的精神寄託。"}, "歸園田居": {"trans": "在南山的山腳下開墾種植豆苗，野草生長得極為茂盛而豆苗卻顯得稀稀疏疏。清晨早早起身去田間清理雜草荒草，直到夜色降臨才頂著月光扛著鋤頭歸家。歸途的山路狹窄草木瘋長，傍晚冰冷的夜露打濕了我的衣裳。衣服打濕了原本就微不足道並不值得惋惜，只要能讓我順遂本心、不違背隱逸自然的初衷便足夠了！", "explain": "陶淵明代表作。真摯描摹田園躬耕勞作之甘苦，展示其不與污濁官場同流合污的高尚人格。"}, "月夜": {"trans": "今夜鄜州夜空懸掛著明月，妻子在深閨之中必定只能獨自一人淒涼觀看。我遠在異鄉深深憐憫那年幼的兒女，他們年紀尚小還不懂得思念遠在長安的我。夜霧瀰漫打濕了妻子烏黑的鬢髮，清冷的月輝照映在她潔白如玉的手臂上令人覺寒。不知何時才能與妻子重聚倚靠在虛薄的帷幔旁，讓月光同時照亮我們二人，把思念的淚痕一同照乾！", "explain": "杜甫身陷長安叛軍圍困時思念妻子之作。設身處地想像妻子望月思夫之深情，淒惻溫存，感人至深。"}, "賦得古原草送別": {"trans": "遼闊的原野上青草茂密繁盛，歷經一年一度的一枯一榮。哪怕無情的野火將它徹底焚燒也絕不能燒盡，待到溫暖的春風吹拂而來它又會重新勃發繁衍。遠遠的芳草芬芳侵入了古老的大道，晴光下青翠的碧色連接到了荒涼的城垣。在此又一次送別王孫好友遠行，那滿目萋萋的荒草正如滿懷離別依依深情！", "explain": "白居易十六歲時一舉成名之應試之作。「野火燒不盡，春風吹又生」成為頑強生命力的永恆讚歌。"}, "初春小雨": {"trans": "京城天街上飄灑著如酥油般細潤的小雨，早春的草色遠遠望去隱隱約約一片青綠，可走近細看時卻又似有似無。這正是一年之中最美好迷人的早春勝景，遠遠勝過那暮春時節煙柳堆煙籠罩整座皇都的光景啊！", "explain": "韓愈精微捕捉初春極其微妙之綠意，以「草色遙看近卻無」名垂千古，清新淡雅，妙手偶得。"}, "旅夜書懷": {"trans": "微風輕拂著岸邊細柔的青草，江中危聳著桅杆停泊著一隻孤獨的夜舟。星辰低垂在遼闊平坦的曠野之上，明月躍起於奔騰滾滾的滔滔大江之中。我難道是因為詩篇文章才得以聞名於世嗎？為官的仕途早已因年老多病而應當罷休。漂泊一生的我究竟像個什麼呢？只不過是這浩渺天地之間一隻孤獨翻飛的沙鷗罷了！", "explain": "杜甫晚年自四川出峽時的千古絕唱。以天地遼闊之大景襯托個體漂泊之孤舟沙鷗，悲壯蒼茫到了極致。"}, "過故人莊": {"trans": "老朋友備下了豐盛的黃米飯和雞肉，熱情邀請我來到他的田家做客。翠綠的樹木緊緊環抱著村莊，青翠的遠山在城郭之外逶迤橫斜。打開窗軒正對著農家的打穀場與菜園，舉起酒杯開懷暢談著桑麻農事。等到九月九日重陽節的那一天，我一定還要再來這裡品嘗美酒、欣賞怒放的金菊！", "explain": "孟浩然田園詩之代表作。平淡質樸如家常話，卻洋溢出無比深厚真摯的田園友情與生活情趣。"}, "望月懷遠": {"trans": "浩瀚的大海之上湧現出一輪明月，天涯海角的有情人在這一刻共同凝望著這同一個夜空。有情人總是埋怨這漫漫長夜是如此幽深漫長，整整一夜都難以遏止胸中那翻騰的相思深情。吹滅蠟燭更加憐愛這滿室皎潔的月色，披上外衣更覺得夜露深沉滋潤。月光縱美卻無法滿手捧取贈送給遠方的你，還是回到寢室期望能在美夢中與你共赴佳期吧！", "explain": "張九齡「海上生明月，天涯共此時」為唐代望月懷人詩之頂峰，意境高朗宏大，感情纏綿悱惻。"}, "夜雨寄北": {"trans": "您頻頻問起我何時歸去，而我歸去的日期實在遙遙無期無法確定；此時此刻巴山正下著綿綿夜雨，漫漲了秋天的池塘。不知到了哪一天我們才能再度相聚，一同坐在西窗下一邊剪著燭花，一邊細細訴說今夜巴山聽雨時的無盡思念呢！", "explain": "李商隱借時空錯落對調之精妙手法，把眼前的羈旅孤悽化作未來的重逢暢敘，深情無限。"}, "楓橋夜泊": {"trans": "月亮西落烏鴉啼叫寒霜灑滿了夜空，江邊的楓樹與漁舟的燈火伴隨著作客的旅人愁苦入眠。姑蘇城外那古老的寒山寺院，深夜敲響的鐘聲悠悠傳到了遊子的客船！", "explain": "張繼千古傳世名篇。客船、霜天、夜半鐘聲交織出孤寂悠遠的意境，使寒山寺成為世界文學之文化地標。"}, "題西林壁": {"trans": "從正面橫看是一道連綿的山嶺，從側面眺望又是一座挺拔的孤峰，無論從遠處、近處、高處、低處觀看都各不相同。我之所以不能看清認清這廬山的真實面目，只因為我整個人就身處在這重重的大山包圍之中啊！", "explain": "蘇軾以深入淺出的哲理入詩，「不識廬山真面目，只緣身在此山中」道盡了當局者迷、旁觀者清的深奧哲思。"}, "出塞": {"trans": "頭頂依然是秦漢時期的明月，腳下依然是秦漢時期的邊關，歷朝歷代萬里遠征的將士卻往往長眠塞外未能歸家。倘若龍城飛將軍李廣如今依然健在，定然不會容許外敵胡人的騎兵度過這陰山之巔！", "explain": "王昌齡七言絕句之冠冕。慷慨激昂，融歷史沉思與對名將之渴求於一爐，被後世推為唐人七絕壓卷之作。"}, "月下獨酌": {"trans": "在美麗的花叢之中擺放著一壺美酒，我獨自一人自斟自飲身邊沒有知己相親。索性舉起酒杯熱情邀請天上的明月，再加上自己地上的倒影便湊成了三人同歡。明月雖然根本不懂得暢飲之樂，身影也只是徒然跟隨在我身旁走動。暫時且讓明月與身影做我的同伴吧，人生及時行樂正應當趁著大好春光！我唱歌時明月在天際留連徘徊，我起舞時身影也在地上翻飛零亂。清醒之時我們一同開懷暢飲交歡，喝醉之後便各自散去東西。願永遠與明月身影結下超塵絕俗的忘情幽遊，相約在遙遠縹緲的銀河仙境相見！", "explain": "李白浪漫主義詩歌之極致體現。把最徹底的孤寂化作最宏大的歡鬧狂歡，展示其獨立於世的非凡靈魂。"}, "觀游魚": {"trans": "繞著清澈的池塘悠閒漫步觀看魚兒游弋，正值村中小童划著釣舟在水中垂釣。同一種喜愛游魚的心情卻有著截然相反的表現：我來到池畔是為了拋撒食物餵養牠們，而你們孩童卻是為了垂下釣竿將牠們釣起。", "explain": "白居易以平易自然的白描揭示人對待生命的差異態度，富有哲理趣味與博愛慈悲情懷。"}, "贈別其二": {"trans": "聚會之時滿懷深情看起來反而像是全無感情一般，在離別的酒樽面前只覺得強顏歡笑也笑不出來。那案桌上的蠟燭似乎也懷有靈性深知離別之痛，竟然替我們離人默默流淌著淚水直到天明！", "explain": "杜牧擬人化蠟燭代人垂淚，將無形之離愁具象化為徹夜流淌的燭淚，纏綿深致，傳頌千古。"}, "聞官軍收河南河北": {"trans": "劍門關外忽然傳來了官軍收復薊北的捷報，剛剛聽聞捷報之時淚水早已濕透了衣裳！轉頭看看妻子兒女哪裡還有平日的愁苦，自己更是激動得隨意捲起詩書喜悅到了瘋狂的地步！在大白天裡我要放聲高歌縱情飲酒，趁著大好春光做伴正好啟程回返故鄉！立即從巴峽啟程穿過巫峽，轉眼便順流而下經襄陽直奔洛陽故園！", "explain": "杜甫「生平第一快詩」。疾風驟雨般的筆調噴薄出聽聞戰亂平息後的狂喜與愛國赤誠，痛快淋漓。"}, "泊秦淮": {"trans": "迷濛的煙霧籠罩著冰涼的江水，月光如水灑在岸邊的沙灘上，深夜我將客船停泊在靠近酒家繁華的秦淮河畔。那些賣唱的歌女哪裡知道亡國滅種的深沉悲恨，隔著江水依然在高唱著陳後主那亡國之音《玉樹後庭花》！", "explain": "杜牧借秦淮夜景痛陳晚唐統治者沉溺聲色、重蹈覆轍之危機，諷刺深邃，情調淒艷迷濛。"}, "登金陵鳳凰台": {"trans": "金陵鳳凰臺上曾有鳳凰自在遨遊，如今鳳凰早已遠去臺榭空空唯見長江滾滾奔流。昔日吳國的宮苑繁花芳草如今已淹埋在荒僻幽徑，晉代顯赫的風流士族冠冕早已化作荒涼的古老墳丘。三山聳立在青天之外若隱若現，長江二水在白鷺洲中分流奔馳。天際總有浮雲能夠遮蔽明媚的太陽，望不見長安帝都真使人愁緒滿懷！", "explain": "李白與崔顥《黃鶴樓》爭勝之千古名作。融歷史滄桑、自然山川與長安遠思於一爐，氣象萬千。"}, "勸學": {"trans": "敲擊堅石才會迸發出火星，如果不去敲擊原本就沒有一絲煙火。人唯有經過刻苦學習才能領悟大智慧，不努力學習是絕不可能自然通達真理的。世間萬事都必須仰仗自己的發奮運化，他人哪怕獲得成功也不代表是我自己的才能。青春韶華當抓緊及早奮發圖強，人的一生哪裡能夠永遠停留在年少時代呢！", "explain": "孟郊勉學名作。以石擊火設喻，說理透闢犀利，激勵少年當自立自強、勤奮向學。"}, "渭城曲": {"trans": "清晨渭城驛館的一陣薄薄細雨潤濕了地上的塵埃，客舍周圍青翠的楊柳顯得分外明麗清新。請好友您再次滿飲這杯醇厚的美酒，因為一旦向西走出了陽關邊隘，便再也沒有知心的故人老友了！", "explain": "王維送別名篇，後譜入琴曲稱《陽關三疊》。深情醇厚，真摯動人，成為千古送別詩之無冕之王。"}, "花非花": {"trans": "像花卻不是花，像霧又不是霧。在深邃夜半悄然降臨，天明破曉時分又悄然離去。來的時候宛如春日美夢一般能停留幾多時光呢？離去的時候正如清晨的朝雲不知所蹤、無處可尋。", "explain": "白居易以朦朧詩手法描繪夢幻般不可捉摸的美好物象與人生幻滅之感，語言清妙，意境深婉。"}, "明日歌": {"trans": "明天過後又是明天，世上的明天究竟是何其之多啊！我如果一生只知道等待著未來的明天，那麼萬般事情終究都會一事無成、磋跎荒廢。世上的人們全都被等待明天所拖累耽擱，春去秋來轉眼間垂垂老矣便已降臨。清晨看著江水向東滔滔流逝，傍晚看著落日向西沉淪下墜。人的一生能有幾百個明天呢？請諸位聽一聽我這首發人深省的《明日歌》吧！", "explain": "錢福名作。通俗易懂，朗朗上口，苦口婆心勸勉後人珍惜眼前時光、把握當下。"}, "錦瑟": {"trans": "美麗華貴的錦瑟不知為何無端擁有五十根弦，每一根琴弦、每一個柱位都令人深切追憶起逝去的韶華青春。莊周在清晨夢醒時迷惘分不清自己究竟是蝴蝶還是自身，望帝化為春心杜鵑啼血寄託無盡的哀思。浩瀚滄海在明月映照下珍珠彷彿有情人的眼淚，溫暖藍田在日照之下美玉生起嫋嫋的青煙。這般深情難道要等到今日才成為刻骨追憶嗎？只不過在當時身歷之際，早已是滿心茫然、惘然若失了啊！", "explain": "李商隱畢生詩作之總綱。錦瑟起興，典故繁複精緻，將人生終極的迷惘、追尋與幻滅推向最高藝術殿堂。"}, "贈孟浩然": {"trans": "我極其敬愛隱居襄陽的孟浩然夫子，他高雅風流的清逸名聲天下皆知。年輕韶華之時便甘心拋棄榮華仕途軒冕，年邁白首之際悠然安臥在青松白雲之間。醉心於美酒時常常獨得醉中之聖趣，沉迷於名花山水之中不願逢迎侍奉君王。他那高尚如同巍峨大山的品德叫人如何瞻仰追隨呢？我唯有在這山下虔誠向他作揖、敬仰他芬芳高潔的德馨！", "explain": "李白推崇孟浩然高潔隱士情操之頌歌。情真意切，語言純粹高雅，將詩人間的神交刻畫得淋漓盡致。"}, "虞美人": {"trans": "這春花秋月的美好良辰究竟何時才能了結？昔日帝王舊事又知曉多少！昨夜小樓之上又刮起了溫暖的東風，深陷囚牢的我怎堪回首遙望在明月中破滅的故國！昔日江南那雕花欄杆與玉石臺階應該依然矗立在那裡吧，只是故宮中宮人的紅潤容顏早已斑駁衰改。如果問我心中究竟有多少滔滔愁緒？那真正如同一整江浩蕩奔騰的春水，滾滾向東無休無止地流淌！", "explain": "李煜詞中神品。將抽象的亡國深恨化作滾滾春水，悲壯蒼涼，沈痛徹骨，成就千古詞帝美名。"}, "黃鶴樓": {"trans": "古代仙人早已乘著黃鶴飛天而去，如今這座空蕩蕩的江岸之城唯獨留下了這座古老的黃鶴樓。黃鶴一旦飛去便再也不曾重新回返，天邊千百年來的悠悠白雲徒然在長空空自漂泊。陽光下漢陽城中樹木蔥蘢歷歷在目，鸚鵡洲上的春草繁茂萋萋青綠。黃昏日落時分回首望向故鄉不知在何處呢？只見長江水面上浩渺的煙波瀰漫，真叫人滿懷離愁別緒！", "explain": "崔顥登樓千古絕唱。神話幻境與江山勝景相得益彰，李白見之擱筆，被譽為唐代七言律詩之第一。"}, "送友人": {"trans": "蒼翠的青山橫亙在北城之外，清澈的白水蜿蜒環繞著東城流淌。在這個地方我們二人就要作別分離了，朋友您將如同漂泊的孤蓬一般踏上萬里遠征。飄浮的白雲正如行蹤不定的遊子心意，落下的夕陽正如難捨難分的故人深情。揮一揮手就此離別踏上征途，兩匹即將分道揚鑣的駿馬發出了蕭蕭的離群嘶鳴！", "explain": "李白送別名篇。青山、白水、浮雲、落日、班馬鳴，畫面明朗生動，離情依依而不顯消沉。"}, "浣溪沙": {"trans": "填了一曲新詞飲上一杯美酒，眼前依然是去年的溫暖天氣和舊日亭臺，夕陽向西漸漸落下不知何時才能回轉？花兒無可奈何隨風飄零落下，似曾相識的燕子又輕盈飛回，獨自一人在小園落花香徑上默默徘徊。", "explain": "晏殊詞中名篇。名句「無可奈何花落去，似曾相識燕歸來」情致天然，將無奈感傷與生命哲理融為一體。"}, "水調歌頭": {"trans": "明月究竟從何時開始有的呢？我舉起酒杯遙遙問訊長空青天。不知九天之上的瓊樓玉宇，今夜又翻過了是哪一年。我真想乘著清風飛回那美麗的月宮，卻又唯恐那瓊樓玉宇太過寒冷高處不勝寒涼。翩翩起舞與清澈的身影嬉戲相伴，哪裡比得上在人間充滿煙火真情的美好呢！月光轉過了硃紅的樓閣，低低照在雕花門窗之內，照著無眠的離人。月亮原本不應當對人間有什麼怨恨吧，為什麼偏偏要在人們離別的時候才顯得如此圓滿呢？人世間自古有悲歡離合，月亮也有陰晴圓缺，這樣的事物自古以來就極難周全兩全。只願我們相愛相念的人能夠長長久久，縱使相隔千里萬里也能共同分享這同一輪美好月色！", "explain": "蘇軾中秋望月懷念胞弟蘇轍之作，豪邁奔放與哲理通達完美結合，胡仔讚其「中秋詞自東坡《水調歌頭》一出，餘詞盡廢」。"}, "天淨沙·秋思": {"trans": "枯藤纏繞著老樹上方黃昏歸巢的烏鴉啼叫，小巧的木橋下流水潺潺旁佇立著尋常人家，荒涼古道上迎著蕭瑟秋風行走著疲憊的瘦馬。夕陽已經漸漸西下沉落，無比悲傷斷腸的漂泊遊子，依然隻身一人流落天涯！", "explain": "馬致遠以二十八字純粹由名詞意象疊加，營造出秋郊夕照之極致荒涼與羈旅之悲，被譽為「秋思之祖」。"}, "輞川閒居贈裴秀才迪": {"trans": "寒山在落日暮色中轉為深沈的青翠，秋日溪水日夜潺潺地流淌。拄著手杖倚立在柴門之外，在迎面晚風中靜聽暮蟬的啼鳴。江邊渡口停留著殘存的夕陽餘暉，墟里炊煙嫋嫋升起孤單飄蕩。又遇到如同接輿般狂傲醉酒的好友裴迪，在五柳宅前放懷狂歌！", "explain": "王維隱居輞川別業時所作，詩情畫意與高士知己相映成趣，境界幽遠恬靜。"}, "飲酒": {"trans": "我把草廬房舍搭建在這人世間，耳邊卻完全沒有車馬喧鬧的煩擾。若要問我為何能夠達到這般超脫境界呢？只要自己內心高遠空靈，所處的地方自然就會變得偏遠清幽。在東籬之下悠閒地採摘菊花，抬頭無意間便悠然看見了終南南山。山林間夕陽西下的雲氣多麼美好，飛鳥成群結伴相伴飛回巢穴。這清純自然之中孕育著人生的真實旨趣，正想開口辨析明白，卻發現內心早已忘卻了言語之表達！", "explain": "陶淵明田園詩之代表作，「採菊東籬下，悠然見南山」超凡脫俗，達到了天人合一之極致妙境。"}, "登高": {"trans": "天高風急遠處峽谷傳來猿猴哀傷的長嘯，沙洲清冷江岸潔白飛鳥在風中盤旋迴轉。無邊無際的蕭蕭落葉漫天飄零紛紛落下，奔騰不息的滾滾長江萬里滔滔奔流而來！萬里奔波悲嘆深秋我常年身作異鄉異客，一生多病暮年時獨自登上這高高的危臺。備嘗艱難歷盡苦恨兩鬢已染滿了斑白繁霜，潦倒困頓之中又新近被迫停下了借酒消愁的濁酒杯！", "explain": "杜甫晚年登高絕作，被明代胡應麟譽為「古今七律第一」。八句皆對，情景交融，沈雄博大，氣蓋千古。"}, "蜀先主廟": {"trans": "天下第一英雄劉備的豪壯氣魄，歷經千秋歲月依然凜然長存！當年以大勢鼎立三分天下，克復漢室重鑄五銖漢錢。有幸得到諸葛孔明這樣的賢相開創基業，生下的後代阿斗卻無法繼承聖賢德才。令人淒涼的是昔日蜀漢宮廷裡的歌妓，如今卻被迫在魏國宮殿之前舞弄歡顏！", "explain": "劉禹錫借謁蜀先主廟詠史懷古，撫今追昔，讚頌劉備、孔明之英雄氣節，諷刺後主荒唐失國。"}, "蜀相": {"trans": "丞相諸葛孔明的祠堂究竟應當到哪裡去尋訪呢？就在錦官城外那柏樹蒼翠森森的地方。映照石階的碧綠青草自得春意盎然，隔著濃蔭的黃鸝鳥空自發出婉轉啼聲。三番登門懇請定下了平分天下的宏圖大計，歷經兩代開國濟世傾盡了老臣一腔赤膽忠心。只可惜出師大捷未曾奏效自己便先病死軍中，長久使得千百年來的天下英雄感動得淚濕沾襟！", "explain": "杜甫定居成都草堂時謁武侯祠所作，末二句成為古今志士仁人抱憾殉國時最深切的同聲一歎。"}, "生查子": {"trans": "去年元宵節的夜晚，花燈市場燈火通明燦爛如白晝；月兒升上了柳樹的枝梢頭頭，情人相約在黃昏之後相會。今年元宵節的夜晚，那一輪明月與繁華花燈依然如舊；卻再也看不見去年的心愛之人，止不住的思念淚水打濕了春天的衫袖！", "explain": "歐陽修名詞。物是人非之感傷以極其對比工整的時空對照呈現，含蓄深婉，動人心弦。"}, "無題": {"trans": "昨夜仰望滿天星辰昨夜迎著和煦春風，我们在畫樓西畔桂堂東面歡聚一堂。身上雖然沒有彩鳳那樣美麗的雙翼可以比翼雙飛，內心深處卻如通靈的犀牛之角那樣靈犀相通。宴席間隔著座位傳遞藏鉤猜拳美酒微醺，分組圍坐射覆遊戲映照著燭燈通紅。無奈天明聽到更鼓響起只得奔赴官職，身不由己策馬奔向蘭臺，就像隨風旋轉的蓬草一般身不由己！", "explain": "李商隱愛情名篇，「身無彩鳳雙飛翼，心有靈犀一點通」千古傳唱，把心心相印之戀情昇華至極致。"}, "長相思": {"trans": "汴河的水在長流，泗河的水在奔流，滔滔江水一直流淌到了瓜州古老的渡口之畔。遙遙望去吳地的群山彷彿點綴著無盡的愁緒。思念綿綿悠悠無盡，怨恨綿綿悠悠無休，這份思念與怨恨要直到夫君歸來之時才方能平息止休。明月當空之下，唯有孤單的一人倚立在高樓上默默凝望。", "explain": "白居易借流水與吳山詠嘆思婦相思，語言宛轉清新，疊字生輝，情真意切。"}, "西江月": {"trans": "皎潔明月驚動了枝頭棲息的喜鵲，清涼半夜微風吹拂傳來陣陣蟬鳴。在稻花芬芳的清香中人們談論著豐收的年歲，四處傳來一片歡快的蛙聲起伏。七八顆稀疏的星斗點綴在天外，兩三點零星的雨滴灑落在山前。循著舊日熟悉的道路走過茅店社林邊，小路轉過小橋忽然就出現在眼前！", "explain": "辛棄疾名篇。清新活潑，洋溢著豐收之喜悅與夏夜農村自然閒適的江南情趣。"}, "春望": {"trans": "國都長安淪陷於叛軍殘破不堪山河依然長存，春天京城之中草木雜草叢生深邃茂密。感傷時局繁花盛開也禁不住淚水漣漣，痛恨分別鳥兒啼鳴也使人內心驚懼。戰火接連燃燒了三個多月不熄，一封家鄉寄來的書信抵得過萬兩黃金。頭上的白髮越抓越稀疏短少，稀薄得簡直連一根髮簪都快插不住了！", "explain": "杜甫身陷長安時所作，「國破山河在，城春草木深」與「烽火連三月，家書抵萬金」為中華愛國詩歌第一金句。"}, "醜奴兒": {"trans": "少年年少時不懂得憂愁是何等滋味，喜愛登上一層層的高樓，喜愛登上一層層的高樓，為了寫出新穎的詩詞勉強裝作出滿腹愁緒。而如今飽經滄桑嘗遍了世間所有愁苦滋味，想要傾訴一番卻又欲說還休，想要傾訴一番卻又欲說還休，只是淡淡說了一聲：『天涼了，真是一個好秋天啊！』", "explain": "辛棄疾歷經坎坷後之感懷。少年強賦與暮年欲說還休之鮮明對比，道盡人生閱歷之無言深痛。"}, "臨江仙": {"trans": "滾滾長江向東滔滔奔流不息，江面上奔騰翻滾的浪花淘盡了古往今來多少風流英雄！是非成敗在歷史長河轉頭就化作一場虛空。唯有那巍峨青山依然矗立千古，在殘陽中幾度映照著夕陽彤紅。白髮蒼蒼的漁夫與樵夫生活在江渚之上，早已習慣了觀看秋月春風的四時變幻。在難得的相逢中開懷共享一壺濁酒，古往今來發生了多少紛紛擾擾的興亡舊事，全都付諸於這歡聲笑談之中了！", "explain": "楊慎詞中極品，後作為《三國演義》卷首開篇詞。意象宏大蒼茫，超然物外，以千古浩瀚胸襟包容歷史興衰。"}, "相見歡": {"trans": "無言以對默默一人獨自登上西樓，夜空中斜掛著一彎如銀鉤般的殘月。寂寞冷清的梧桐樹在深沉庭院之中，彷彿深鎖了整座清寒蕭瑟的深秋。那剪也剪不斷、理也理不清紛亂的，正是這撕心裂肺的離愁別恨。這是一番別樣獨特、難以言喻的苦澀滋味，長久長久縈繞在我的心頭！", "explain": "李煜亡國入宋後幽居深院所作，「剪不斷，理還亂，是離愁」精準道盡人生離別痛苦之糾葛無解。"}, "絕句_杜甫": {"trans": "兩隻黃鸝在翠綠的楊柳枝頭清脆鳴叫，一行白鷺展翅飛向高遠蔚藍的青天。憑窗遠眺可望見西嶺積雪覆蓋的千年雪山，門口水路上停泊著準備啟程航往萬里之外東吳的客船。", "explain": "杜甫浣花溪草堂名作。四句詩勾勒出四幅色彩明麗、對仗極其工整之錦繡春景，格局雄闊大氣。"}, "絕句_僧志南": {"trans": "在古樹青翠的陰涼中繫好了小船，手拄著藜杖攙扶著自己緩緩走過小橋向東漫步。絲絲小雨打濕衣裳那是杏花微雨的潤澤，迎面吹來的和煦微風一點也不感到寒冷正是楊柳春風！", "explain": "南宋僧志南描寫春雨微風的千古名作。詩句清新流麗，自然妥帖，傳遞出無限安詳喜悅。"}, "涼州詞_王翰": {"trans": "精緻珍貴的夜光杯中斟滿了醇香的葡萄美酒，正要縱情暢飲，馬上琵琶已急促催人出征。哪怕醉倒在這廣袤沙場上諸位君子也切莫見笑，自古以來奔赴沙場征戰的人，能有幾人活著回家呢？", "explain": "王翰以豪飲作別、笑對生死的狂放姿態，道出守塞軍士深沉的慷慨悲壯，境界極高。"}, "涼州詞_王之渙": {"trans": "黃河彷彿奔騰遠上白雲之端，那一座孤零零的邊防戍城矗立在萬仞高山之中。何必要用羌笛吹奏那幽怨傷感的《折楊柳》曲調呢，春天的春風原本就吹度不過這高高的玉門關啊！", "explain": "王之渙將邊塞黃河之雄闊蒼茫與戍邊將士遠隔春風之悲慨完美交織，格調高亢悲壯。"}, "月夜_劉方平": {"trans": "夜色漸漸深沉，半邊人家都沐浴在如水的皎潔月光之中；北斗星與南斗星在天際靜靜橫斜。今夜格外感受到春天萬物回暖的溫潤氣息，那輕柔的蟲鳴聲已悄悄透過了綠色的窗紗傳入耳來。", "explain": "劉方平以敏銳纖細的感覺捕捉春回大地的微妙徵兆，月色靜謐，蟲聲怡人，極具詩情畫意。"}, "月夜_杜甫": {"trans": "今夜鄜州夜空懸掛著明月，妻子在深閨之中必定只能獨自一人淒涼觀看。我遠在異鄉深深憐憫那年幼的兒女，他們年紀尚小還不懂得思念遠在長安的我。夜霧瀰漫打濕了妻子烏黑的鬢髮，清冷的月輝照映在她潔白如玉的手臂上令人覺寒。不知何時才能與妻子重聚倚靠在虛薄的帷幔旁，讓月光同時照亮我們二人，把思念的淚痕一同照乾！", "explain": "杜甫身陷長安叛軍圍困時思念妻子之作。設身處地想像妻子望月思夫之深情，淒惻溫存，感人至深。"}, "勸學_顏真卿": {"trans": "深夜三更點燈苦讀直到五更公雞啼曉，這正是男兒發奮刻苦讀書的大好時機。年少黑髮之時若不知道及早勤奮向學，等到年邁白髮蒼蒼之時再來後悔讀書太遲，可就悔之晚矣！", "explain": "顏真卿勉學格言詩。對仗嚴整，警句鏗鏘有力，成為中華民族歷代學子修身勉學的座右銘。"}, "勸學_孟郊": {"trans": "敲擊堅石才會迸發出火星，如果不去敲擊原本就沒有一絲煙火。人唯有經過刻苦學習才能領悟大智慧，不努力學習是絕不可能自然通達真理的。世間萬事都必須仰仗自己的發奮運化，他人哪怕獲得成功也不代表是我自己的才能。青春韶華當抓緊及早奮發圖強，人的一生哪裡能夠永遠停留在年少時代呢！", "explain": "孟郊勉學名作。以石擊火設喻，說理透闢犀利，激勵少年當自立自強、勤奮向學。"}, "浣溪沙_韋莊": {"trans": "夜夜漫長在刻骨相思中聽著銅壺滴漏漸漸殘破，滿懷傷心仰望明月倚靠在冰冷的欄干旁。深深懸念著遠方的您思念我時錦被是否感到寒冷。畫堂雖近咫尺卻深邃如同大海難越，追憶往事時唯有把當年的舊書反覆翻閱。不知何年何月才能與您攜手同行，一同返回繁華的長安故都呢？", "explain": "韋莊詞風清麗纏綿，把對戀人的相思深情與渴望重返長安的家國隱痛交融一體，耐人尋味。"}, "浣溪沙_晏殊": {"trans": "填了一曲新詞飲上一杯美酒，眼前依然是去年的溫暖天氣和舊日亭臺，夕陽向西漸漸落下不知何時才能回轉？花兒無可奈何隨風飄零落下，似曾相識的燕子又輕盈飛回，獨自一人在小園落花香徑上默默徘徊。", "explain": "晏殊詞中名篇。名句「無可奈何花落去，似曾相識燕歸來」情致天然，將無奈感傷與生命哲理融為一體。"}, "長相思_李白": {"trans": "長相思啊長相思，相思之人在繁華長安。紡織娘在秋雨初晴的雕花井闌邊啼鳴，微霜淒清薄簟泛起絲絲寒意。孤燈昏暗相思之情深入骨髓幾近欲絕，捲起帷幔仰望夜空明月唯有長長歎息，心中美人宛如天仙隔在雲端不可及。上方的青天是那麼高遠浩渺深不可測，下方的江水是那麼洶湧澎湃掀起波瀾。天長路遠靈魂飛越追尋是何等艱辛，連夢魂想要飛越重重關山也是這般艱難。這無休止的長相思啊，簡直要摧折揉碎了我整個心肝！", "explain": "李白樂府名作，情感汪洋恣肆，將對長安的政治理想與對知己的刻骨眷戀交織宣洩，痛徹心扉。"}, "長相思_白居易": {"trans": "汴河的水在長流，泗河的水在奔流，滔滔江水一直流淌到了瓜州古老的渡口之畔。遙遙望去吳地的群山彷彿點綴著無盡的愁緒。思念綿綿悠悠無盡，怨恨綿綿悠悠無休，這份思念與怨恨要直到夫君歸來之時才方能平息止休。明月當空之下，唯有孤單的一人倚立在高樓上默默凝望。", "explain": "白居易借流水與吳山詠嘆思婦相思，語言宛轉清新，疊字生輝，情真意切。"}, "青玉案": {"trans": "東風拂過在元宵夜裡吹開了滿城千樹燈花，彷彿更吹落了漫天的繁星如同急雨般落下。華麗的寶馬與雕飾精美的香車散發著香氣奔馳在街道上。鳳簫奏響清脆動人的旋律，玉壺般的明月流轉光華，整整一夜都有著璀璨的魚龍彩燈翩翩起舞。仕女們頭上插戴著雪柳、黃金絲縷的美麗頭飾，笑語盈盈帶著陣陣暗香遠去。我在茫茫人海燈火中尋覓尋找著心儀的她千百回；驀然間回首望去，沒想到那個人卻偏偏佇立在燈火稀疏冷落、無比恬淡的地方！", "explain": "辛棄疾名篇。以元夕狂歡熱鬧襯托「那人」幽居冷落處之高標獨立，寄託詞人潔身自好、不慕繁華之崇高人格。"}}};

    // Build flattened master list of all 123 poems
    const ALL_POEMS = [];
    STATIONS.forEach((st, stIdx) => {
      for (const [dyn, authors] of Object.entries(st.dynasties_data)) {
        for (const [author, poems] of Object.entries(authors)) {
          poems.forEach(p => {
            p.stIdx = stIdx;
            p.globalIdx = ALL_POEMS.length;
            ALL_POEMS.push(p);
          });
        }
      }
    });

    let currentModalPoemIdx = 0;

    function getPoemMeta(title, author) {
      const keyCombo = title + '_' + author;
      if (POEM_META.poem_explanations[keyCombo]) return POEM_META.poem_explanations[keyCombo];
      if (POEM_META.poem_explanations[title]) return POEM_META.poem_explanations[title];
      return {
        trans: "此首詩作文字精練雅正，意境深遠，為古典詩詞之典範。",
        explain: "此篇收錄於《長安文選集》，引導學童由淺入深體會古典漢語的聲韻節奏與文學意境。"
      };
    }

    function getAuthorBio(author) {
      if (POEM_META.author_bios[author]) return POEM_META.author_bios[author];
      return "中國古典文學名家，其傳世之作情思深遠，流傳百代。";
    }

    function openPoemModal(idx) {
      if (idx < 0 || idx >= ALL_POEMS.length) return;
      currentModalPoemIdx = idx;
      const p = ALL_POEMS[idx];
      const st = STATIONS[p.stIdx];
      const meta = getPoemMeta(p.title, p.author);
      const bio = getAuthorBio(p.author);

      document.getElementById('pm-grade-badge').innerText = p.grade + '・' + st.stage + '・' + st.landmark;
      document.getElementById('pm-seq-badge').innerText = p.semester + ' 第' + p.num + '首';
      document.getElementById('pm-title').innerText = '〈' + p.title + '〉';
      document.getElementById('pm-author').innerText = '【' + p.dynasty + '】' + p.author;
      
      stopPoemSpeech();
      const isZhuyin = (p.grade === '一年級' || p.grade === '二年級' || p.grade === '三年級');
      const linesEl = document.getElementById('pm-lines');
      const titleEl = document.getElementById('pm-title');
      const fontBadgeEl = document.getElementById('pm-font-badge');

      // Calculate longest line character count to ensure 100% same line without wrap
      const maxLineLen = Math.max(...p.content.map(l => l.length));

      if (isZhuyin) {
        linesEl.classList.add('zhuyin-mode');
        titleEl.classList.add('zhuyin-mode');
        if (maxLineLen >= 15) {
          linesEl.style.fontSize = '21.5px';
          linesEl.style.letterSpacing = '0.5px';
        } else {
          linesEl.style.fontSize = '24.5px';
          linesEl.style.letterSpacing = '1px';
        }
        if (fontBadgeEl) {
          fontBadgeEl.innerText = '🔤 芫荽注音體';
          fontBadgeEl.style.background = 'rgba(39, 174, 96, 0.25)';
          fontBadgeEl.style.borderColor = '#27ae60';
          fontBadgeEl.style.color = '#2ecc71';
        }
      } else {
        linesEl.classList.remove('zhuyin-mode');
        titleEl.classList.remove('zhuyin-mode');
        // Standard Iansui (Grades 4, 5, 6, e.g. 〈錦瑟〉): generous large font size
        if (maxLineLen >= 18) {
          linesEl.style.fontSize = '25.5px';
          linesEl.style.letterSpacing = '1.8px';
        } else {
          linesEl.style.fontSize = '28.5px';
          linesEl.style.letterSpacing = '2.5px';
        }
        if (fontBadgeEl) {
          fontBadgeEl.innerText = '🔤 芫荽體';
          fontBadgeEl.style.background = 'rgba(178, 136, 80, 0.25)';
          fontBadgeEl.style.borderColor = '#b28850';
          fontBadgeEl.style.color = '#ffd166';
        }
      }

      const linesHtml = p.content.map((line, lIdx) => `<div class="pm-line-item" id="pm-line-${lIdx}">${line}</div>`).join('');
      linesEl.innerHTML = linesHtml;

      const noteEl = document.getElementById('pm-note');
      if (p.note) {
        noteEl.innerText = '※ 注釋：' + p.note;
        noteEl.style.display = 'inline-block';
      } else {
        noteEl.style.display = 'none';
      }

      document.getElementById('pm-trans').innerText = meta.trans;
      document.getElementById('pm-explain').innerText = meta.explain;
      document.getElementById('pm-author-title').innerText = '【作者簡介：' + p.author + '】';
      document.getElementById('pm-author-bio').innerText = bio;

      document.getElementById('pm-indicator').innerText = (idx + 1) + ' / ' + ALL_POEMS.length;
      document.getElementById('pm-prev-btn').disabled = (idx === 0);
      document.getElementById('pm-next-btn').disabled = (idx === ALL_POEMS.length - 1);

      document.getElementById('poem-modal').classList.add('open');
      playSound('fly');
    }

    function closePoemModal() {
      stopPoemSpeech();
      document.getElementById('poem-modal').classList.remove('open');
    }

    function onPoemModalBackdropClick(e) {
      if (e.target === document.getElementById('poem-modal')) {
        closePoemModal();
      }
    }

    function navigatePoemModal(delta) {
      const targetIdx = currentModalPoemIdx + delta;
      if (targetIdx >= 0 && targetIdx < ALL_POEMS.length) {
        openPoemModal(targetIdx);
      }
    }

    // Keyboard support for Poem Modal
    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('poem-modal');
      if (modal && modal.classList.contains('open')) {
        if (e.key === 'Escape') {
          closePoemModal();
        } else if (e.key === 'ArrowLeft') {
          navigatePoemModal(-1);
        } else if (e.key === 'ArrowRight') {
          navigatePoemModal(1);
        }
      }
    });

  
    // =========================================================================
    // CLASSICAL POETRY SPEECH RECITATION ENGINE (Web Speech API)
    // =========================================================================
    let speechSynth = window.speechSynthesis;
    let speechVoice = null;
    let isPoemSpeaking = false;
    let speechQueueTimers = [];
    let cardSpeakingIdx = -1;

    function initSpeechVoices() {
      if (!speechSynth) return;
      const voices = speechSynth.getVoices();
      speechVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'zh_TW') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('HsiaoChen') || v.name.includes('YunJhe')))
        || voices.find(v => v.lang === 'zh-TW' || v.lang === 'zh_TW')
        || voices.find(v => v.lang.startsWith('zh'))
        || voices.find(v => v.name.toLowerCase().includes('chinese') || v.name.toLowerCase().includes('taiwan'))
        || null;
    }

    if (speechSynth) {
      if (speechSynth.onvoiceschanged !== undefined) {
        speechSynth.onvoiceschanged = initSpeechVoices;
      }
      initSpeechVoices();
    }

    function stopPoemSpeech() {
      if (speechSynth) {
        speechSynth.cancel();
      }
      speechQueueTimers.forEach(t => clearTimeout(t));
      speechQueueTimers = [];
      isPoemSpeaking = false;
      cardSpeakingIdx = -1;

      // Reset modal UI
      const btn = document.getElementById('pm-speech-btn');
      const waves = document.getElementById('pm-speech-waves');
      const text = document.getElementById('pm-speech-text');
      const icon = document.getElementById('pm-speech-icon');
      if (btn) btn.classList.remove('speaking');
      if (waves) waves.style.display = 'none';
      if (text) text.innerText = '經典吟誦朗讀';
      if (icon) icon.innerText = '🔊';

      // Remove active line highlights
      document.querySelectorAll('.pm-line-item').forEach(el => el.classList.remove('reading-active'));

      // Reset card listen buttons
      document.querySelectorAll('.card-listen-btn').forEach(btn => {
        btn.classList.remove('speaking');
        btn.innerHTML = '🔊 吟誦';
      });
    }

    function speakUtterance(text, rate = 0.84, pitch = 1.0) {
      return new Promise((resolve) => {
        if (!speechSynth) { resolve(); return; }
        const utter = new SpeechSynthesisUtterance(text);
        if (speechVoice) utter.voice = speechVoice;
        utter.lang = speechVoice ? speechVoice.lang : 'zh-TW';
        utter.rate = rate;
        utter.pitch = pitch;
        utter.onend = () => resolve();
        utter.onerror = () => resolve();
        speechSynth.speak(utter);
      });
    }

    async function startPoemSpeech(poem) {
      stopPoemSpeech();
      if (!speechSynth) {
        alert("您的瀏覽器暫不支援語音合成功能");
        return;
      }

      isPoemSpeaking = true;
      const btn = document.getElementById('pm-speech-btn');
      const waves = document.getElementById('pm-speech-waves');
      const text = document.getElementById('pm-speech-text');
      const icon = document.getElementById('pm-speech-icon');
      if (btn) btn.classList.add('speaking');
      if (waves) waves.style.display = 'inline-flex';
      if (text) text.innerText = '停止吟誦';
      if (icon) icon.innerText = '⏹';

      // 1. Read Title and Author with steady introductory cadence
      const introText = poem.title + '。' + poem.dynasty + '，' + poem.author + '。';
      await speakUtterance(introText, 0.86, 1.05);

      if (!isPoemSpeaking) return;
      await new Promise(r => {
        const t = setTimeout(r, 450);
        speechQueueTimers.push(t);
      });

      // 2. Read each line sequentially with cadence pause & highlight
      const lineEls = document.querySelectorAll('.pm-line-item');

      for (let i = 0; i < poem.content.length; i++) {
        if (!isPoemSpeaking) break;

        lineEls.forEach((el, idx) => {
          if (idx === i) el.classList.add('reading-active');
          else el.classList.remove('reading-active');
        });

        const line = poem.content[i];
        await speakUtterance(line, 0.82, 1.0);

        if (!isPoemSpeaking) break;

        // Classical pause between lines (480ms)
        await new Promise(r => {
          const t = setTimeout(r, 480);
          speechQueueTimers.push(t);
        });
      }

      // Finish cleanly
      stopPoemSpeech();
    }

    function togglePoemSpeech() {
      if (isPoemSpeaking) {
        stopPoemSpeech();
      } else {
        const p = ALL_POEMS[currentModalPoemIdx];
        if (p) startPoemSpeech(p);
      }
    }

    async function playQuickCardSpeech(globalIdx) {
      if (isPoemSpeaking && cardSpeakingIdx === globalIdx) {
        stopPoemSpeech();
        return;
      }
      const p = ALL_POEMS[globalIdx];
      if (!p) return;

      stopPoemSpeech();
      cardSpeakingIdx = globalIdx;
      isPoemSpeaking = true;

      const cardBtn = document.getElementById('card-spk-' + globalIdx);
      if (cardBtn) {
        cardBtn.classList.add('speaking');
        cardBtn.innerHTML = '⏹ 停止';
      }

      await speakUtterance(p.title + '。' + p.author + '。', 0.86);
      for (let i = 0; i < p.content.length; i++) {
        if (!isPoemSpeaking) break;
        await speakUtterance(p.content[i], 0.82);
        if (!isPoemSpeaking) break;
        await new Promise(r => {
          const t = setTimeout(r, 450);
          speechQueueTimers.push(t);
        });
      }

      stopPoemSpeech();
    }

  </script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
    // =========================================================================

    const POEM_META = {"author_bios": {"李白": "字太白，號青蓮居士，盛唐偉大的浪漫主義詩人，後世尊為「詩仙」。其詩風雄奇豪放，想像豐富瑰麗，善於運用神話與誇張手法，意境超凡脫俗，與杜甫並稱「李杜」，為中國古典詩歌藝術之巔峰象徵。", "杜甫": "字子美，自號少陵野老，盛唐轉中唐偉大的現實主義詩人，後世尊為「詩聖」，其作品被譽為「詩史」。其詩沈鬱頓挫、對仗嚴整，充滿仁者愛人、憂國憂民的崇高胸懷。", "王維": "字摩詰，號摩詰居士，盛唐著名山水田園詩人、畫家，官至尚書右丞，世稱「王右丞」，後世尊為「詩佛」。其詩多以空靈山水與禪宗悟境為題，蘇軾盛讚其「詩中有畫，畫中有詩」。", "白居易": "字樂天，號香山居士，中唐著名現實主義詩人，世稱「詩魔」或「詩王」。主張「文章合為時而著，歌詩合為事而作」，與元稹共同倡導新樂府運動，語言平易通俗、老嫗能解。", "蘇軾": "字子瞻，號東坡居士，北宋著名文學家、政治家、書畫家，唐宋八大家之一，豪放詞派宗師。其文汪洋恣肆，其詩豪邁超逸，其詞開拓千古意境，兼具深邃哲思與豁達灑脫的人生境界。", "辛棄疾": "字幼安，號稼軒，南宋著名豪放派詞人、愛國將領，與蘇軾並稱「蘇辛」。其詞題材廣闊，充滿收復失地的壯烈情懷與悲憤沈痛，意象雄偉磅礡，風格沉雄豪邁。", "陶淵明": "名潛，字元亮，私諡靖節，自號五柳先生，東晉至南朝宋初偉大文學家，被尊為「古今隱逸詩人之宗」及「田園詩派之祖」。其詩文崇尚自然、不慕名利，真率恬淡而意蘊悠長。", "孟郊": "字東野，中唐著名詩人，與賈島齊名，世稱「郊寒島瘦」。其作詩刻意苦吟、琢句造語奇峭，善於描摹世態人情與母愛深恩，名作〈遊子吟〉傳頌千古。", "孟浩然": "襄州襄陽人，盛唐著名山水田園詩人，世稱「孟襄陽」。與王維並稱「王孟」。一生布衣隱居，其詩清淡雅致、超妙自然，極富藝術情韻。", "杜牧": "字牧之，號樊川居士，晚唐傑出詩人、散文家，與李商隱齊名並稱「小李杜」。其詩雄姿英發、俊爽飄逸，善於詠史抒懷，兼具深厚政見與風流才情。", "李商隱": "字義山，號玉谿生，晚唐著名詩人。其詩構思奇巧、辭藻華美，善於營造朦朧深邃之意境，尤以無題詩與七言律絕著稱，藝術成就極高。", "王之渙": "字季凌，盛唐著名邊塞詩人，晉陽人。性格豪邁大氣，常與高適、王昌齡等詩人交遊唱和。其詩氣勢磅礡、意境高遠，傳世之作雖不多，但〈登鸛雀樓〉與〈涼州詞〉皆為唐代絕句中之千古神品。", "王安石": "字介甫，號半山，北宋著名政治家、思想家、文學家，唐宋八大家之一。其詩雄健峭拔，晚年退居金陵後，詩風轉向精練雅麗、含蓄深邃，被譽為「王荊公體」。", "賈島": "字浪仙，中唐著名苦吟詩人，世稱「詩奴」。早年為僧，後還俗。為人清修孤苦，寫詩講究字斟句酌，「推敲」典故即源於其煉字之執著。", "劉禹錫": "字夢得，中唐著名詩人、哲學家，世稱「詩豪」。其詩風雄渾豪邁，充滿昂揚向上之哲理思辨，與白居易齊名，合稱「劉白」。", "王昌齡": "字少伯，盛唐著名邊塞詩人，世稱「王龍標」，後世尊其為「七絕聖手」或「詩家天子」。其七絕雄渾深邃、含蓄悠遠，邊塞與閨怨詩尤具代表性。", "韓愈": "字退之，自稱郡望昌黎，世稱「韓昌黎」，中唐古文運動倡導者，唐宋八大家之首，被蘇軾譽為「文起八代之衰」。其詩雄奇拔俗、力求創新。", "柳宗元": "字子厚，世稱「柳河東」，唐代傑出文學家、思想家，唐宋八大家之一。其山水遊記與寓言造詣極深，詩風清冷幽邃、托意遙深。", "李紳": "字公垂，中唐詩人、政治家，與白居易、元稹共同提倡新樂府運動。其早期所作〈憫農二首〉深刻揭示農民疾苦，傳頌千古。", "駱賓王": "字觀光，初唐著名詩人，初唐四傑之一。七歲即能詠鵝，文采出眾。隨徐敬業起兵反對武則天，所作〈討武曌檄〉名震天下。", "劉長卿": "字文房，中唐詩人，擅長五言詩，自詡為「五言長城」。其詩多寫山水風景與遷客失意之感，意境幽淡寒涼。", "王建": "字仲初，中唐著名現實主義詩人。其宮詞與樂府詩深入體察民間疾苦與閨闈世態，語言通俗自然，富於生活氣息。", "太上隱者": "唐代終南山著名隱士，姓名與生卒年皆不可考。自稱「太上隱者」，詩風返璞歸真、超然物外。", "蓋嘉運": "盛唐將領，官至開府儀同三司，曾任西節度使。此詩題為其改編創作之邊塞歌曲。", "漢樂府": "漢代掌管音樂的官署（樂府）所採集記錄的民間歌謠與文人創作。其作品質樸生動，反映現實生活，為中國敘事詩發展奠定重要基礎。", "韋應物": "京兆萬年人，中唐著名山水田園詩人。早年任俠，後折節讀書為官。其詩風格高雅閑淡，與王維、孟浩然、柳宗元並稱「王孟韋柳」。", "盧綸": "字允言，中唐詩人，「大曆十才子」之一。其邊塞詩氣勢磅礡、豪邁剛健，尤以〈塞下曲〉組詩最為膾炙人口。", "雍裕之": "字濟之，中唐詩人。詩風清新雅潤，觀察自然細膩傳神。", "西鄙人": "唐代西北邊陲民間無名作者之總稱。「鄙」指邊遠之地。該首民謠真摯反映西北軍民崇敬名將哥舒翰之深情。", "黃巢": "曹州冤句人，唐末農民起義領袖。少有才名，屢試不第，所作賦菊詩豪氣干雲，充滿沖天豪邁之英雄氣魄。", "曹植": "字子建，三國魏著名文學家，曹操第三子。才高八斗，建安文學集大成者，被謝靈運稱讚「天下才有一石，曹子建獨得八斗」。", "陳子昂": "字伯玉，初唐文學家、詩歌革新先驅。力反六朝綺靡詩風，倡導漢魏風骨與復古興寄，開盛唐詩歌磅礡氣象。", "杜秋娘": "唐代金陵人，著名歌妓、詩人，曾為鎮海節度使李錡妾，後入宮受憲宗寵幸。以清婉深情的勸學詩〈金縷衣〉流芳百世。", "宋之問": "字延清，初唐著名詩人，與沈佺期齊名，世稱「沈宋」。對五言、七言近體律詩格律之定型奠定卓越貢獻。", "王翰": "字子羽，盛唐著名邊塞詩人。性格豪爽浪漫、縱情聲色，其作〈涼州詞〉意境雄健豪放，為邊塞詩千古絕唱。", "岑參": "盛唐著名邊塞詩人，世稱「岑嘉州」，與高適並稱「高岑」。兩度出塞，詩中描繪邊疆壯麗風光與將士昂揚士氣，奇偉豪放。", "李益": "字君虞，中唐著名邊塞詩人，世稱「李公佐」。其七絕長於描摹邊塞征人的鄉思愁緒與大漠邊關風貌，情韻深婉。", "韓翃": "字君平，中唐「大曆十才子」之一。詩風輕巧流麗，以〈寒食〉詩「春城無處不飛花」獲唐德宗賞識而晉升中書舍人。", "僧志南": "南宋詩僧，名志南（原手冊作僧志安）。善為詩，朱熹曾為其詩評點，其名作「沾衣欲濕杏花雨」廣為傳頌。", "鄭準": "中唐詩人。其作品清麗靈動，觀察自然景物生動入微。", "高駢": "字千里，晚唐名將、詩人。文武雙全，其山水景物詩工整清新，筆觸明麗。", "朱熹": "字元晦，號晦庵，南宋著名哲學家、理學家、教育家，宋代理學集大成者。其詩富於人生哲理與讀書治學心得。", "張九齡": "字子壽，韶州曲江人，盛唐開元賢相、文學家，世稱「張曲江」。其詩清雅高標、情致溫潤，開盛唐清新詩風。", "劉方平": "中唐詩人。詩風幽婉深秀，善於捕捉春夜微細風光與闺中思緒。", "張繼": "字懿孫，中唐詩人。天寶進士，所作〈楓橋夜泊〉以一鐘之聲點染客船霜夜愁思，使蘇州寒山寺千古名揚天下。", "顏真卿": "字清臣，京兆萬年人，唐代著名政治家、抗安史名臣、書法四大家之一（顏體開創者）。其人忠肝義膽，作詩重教化與勉勵。", "錢福": "字與謙，號鶴灘，明代弘治三年狀元。詩文敏捷豪爽，其〈明日歌〉警策後世莫空度光陰，膾炙人口。", "李煜": "字重光，初名從嘉，號鍾隱、蓮峰居士，南唐末代國君，世稱「南唐後主」、「詞中之帝」。亡國入宋後，詞風由輕艷轉為血淚沈痛，感天動地。", "崔顥": "汴州人，盛唐著名詩人。所作〈黃鶴樓〉氣度宏大、神韻超凡，傳聞李白登黃鶴樓讀之，亦歎「眼前有景道不得，崔顥題詩在上頭」。", "韋莊": "字端己，晚唐五代花間派詞人代表，與溫庭筠並稱「溫韋」。其詞風格清麗疏朗、情致哀傷，工於敘事與抒情。", "馬致遠": "號東籬，元代著名戲曲家、散曲家，與關漢卿、白樸、鄭光祖並稱「元曲四大家」，被尊為「曲狀元」。其小令意境深遠空靈。", "歐陽修": "字永叔，號醉翁、六一居士，北宋政治家、文學家，北宋詩文革新領袖，唐宋八大家之一。其詞委婉含蓄、清麗自然。", "晏殊": "字同叔，北宋政治家、文學家，十四歲賜同進士出身。其詞語言純粹溫潤、音律諧婉，承五代南唐遺風，開北宋詞壇先聲。", "楊慎": "字用修，號升庵，明代著名文學家、學者，明代正德六年狀元。學問廣博，所作〈臨江仙〉被清代毛宗崗選為《三國演義》卷首詞，名揚四海。"}, "poem_explanations": {"送柳淳": {"trans": "翠綠青山面臨著奔騰黃河，山腳下橫臥著通往長安的驛道。世上追逐功名利祿的人們熙來攘往，只顧奔波忙碌，連自己容顏衰老都不曾察覺。", "explain": "孟郊借長安古道上名利之客的匆忙身影，對世俗奔波給予深刻的警醒與反思，意境深遠，格調高古。"}, "夜思": {"trans": "明亮的月光灑在床鋪之前，恍惚間像是在地上凝結了一層白霜。我禁不住抬起頭遙望夜空中的明月，又低下頭深深思念起遠方的故鄉。", "explain": "李白最傳誦的思鄉名篇。以極其質樸平實的語言，傳神寫出遊子深夜忽見明月時那份最真摯、最純粹的鄉愁。"}, "憫農": {"trans": "農夫在正午炎炎烈日下耕耘鋤草，滴滴汗水滲入了禾苗生長的泥土中。有誰能體會這盛在飯碗裡的美味米飯，每一顆都是農民辛勤勞動的結晶呢！", "explain": "深刻反映農人稼穡之艱難苦痛，結句「誰知盤中飧，粒粒皆辛苦」成為千百年來世人愛惜糧食、感懷勞作的至理名言。"}, "秋浦歌": {"trans": "滿頭白髮長達三千多丈，只因胸中的離愁別緒就是這般的深長綿延。若不是看著明鏡中的倒影，哪裡能知道自己何時染上了這滿頭深秋的白霜！", "explain": "李白巧妙運用極致的誇張藝術，把內心無邊無際的愁緒具象化為三千丈白髮，浪漫奇絕，震撼人心。"}, "尋隱者不遇": {"trans": "在蒼翠松樹下向小童子詢問先生的去向，童子回答說：『師父已經採藥去了；他就在這座大山之中，只是山中雲霧繚繞，我也不知道他身在何處。』", "explain": "賈島以三番問答入詩，言簡意賅，將尋訪不遇之惆悵轉化為對隱者高潔空靈情操的無限嚮往。"}, "竹里館": {"trans": "我獨自端坐在幽靜青翠的竹林深處，一邊彈弄著古琴，一邊引吭長嘯。在這深林之中沒有世人知曉我的雅趣，只有夜空中的一輪明月穿透竹影，溫柔相照。", "explain": "王維山水田園詩之代表作。以琴聲、長嘯與明月相伴，傳達出詩人安詳澄澈、超塵絕俗的高雅禪趣。"}, "送別": {"trans": "在幽靜山林中送別了摯友，夕陽西下，我默默掩上柴門。春草到了明年依然會青翠茂密，但不知遠遊的王孫好友，那時究竟歸不歸來呢？", "explain": "全詩含蓄溫婉，將送友之後的悵惘寄託於門掩夕陽與萋萋春草之中，餘韻無窮。"}, "江雪": {"trans": "重重群山之中群鳥都已飛盡無蹤，條條小路上也不見任何人的腳印痕跡。只有一葉孤舟上一位披蓑戴笠的老翁，冒著滿天風雪，獨自垂釣這寒冷江波。", "explain": "柳宗元被貶永州時所作。以萬籟俱寂的冰雪天地為襯托，刻畫出孤高拔俗、百折不撓的精神人格像。"}, "登鸛雀樓": {"trans": "夕陽依傍著西山漸漸沉落，奔騰的黃河滾滾向東海奔流。若是想要看盡千里之外更加壯麗的風光，那就必須再登上一層樓！", "explain": "王之渙將雄渾壯闊的自然寫景與積極進取的人生哲理完美融為一體，展現盛唐昂揚向上的博大胸懷。"}, "雜詩": {"trans": "您剛從我們的故鄉遠道而來，一定知曉故鄉發生的種種事情吧！請問您動身啟程的那天，我家雕花窗前的那株寒梅，開花了沒有呢？", "explain": "王維不問天下大事，獨扣寒梅著花未，以微小細節傳達出遊子對家鄉極其深切細膩的依戀之情。"}, "在軍登城樓": {"trans": "登上城樓，只覺高風陣陣寒意凜冽；滾滾江水之上瀰漫著冰冷水氣。不知這軍營戎裝何時才能平定戰火脫下，讓我們踏著歡慶歌舞重返繁華長安！", "explain": "駱賓王隨軍征戍之時登樓有感，既寫邊地之苦寒肅殺，更流露渴望戰亂早息、天下太平之熱切祈盼。"}, "春曉": {"trans": "春日清晨睡得十分香甜香美，不知不覺天就亮了，到處都能聽見鳥兒歡快的啼鳴聲。回想起昨夜風雨交加的聲響，不知那些美麗的花朵被打落了多少呢！", "explain": "孟浩然隨性擷取春晨生活片斷，寫出對明媚春光的由衷欣喜與愛花惜春之純真情懷，自然流暢無比。"}, "相思": {"trans": "晶瑩鮮紅的紅豆生長在溫暖的南方，不知在春風中又萌發長出了幾多枝條？希望好友您能夠多多採擷一些，因為這種紅豆正是最能寄託相思深情的信物啊！", "explain": "王維借南方紅豆詠歎友情與眷戀，語調溫潤優雅，寄意深微，成為中華相思文化最經典之代名詞。"}, "答人": {"trans": "偶爾信步漫步來到青松樹下，便悠閒地枕著白石安然入睡。這深山之中遠離塵囂沒有日曆可查，每當寒冬過盡，我甚至不知道人間又翻過了哪一年。", "explain": "詩意極具道家超脫與出世境界，展現擺脫名利拘束、與山林日月合而為一的真純自由。"}, "獨坐敬亭山": {"trans": "成群的鳥兒高飛遠去直到無影無蹤，天際的一抹孤雲也獨自自在悠閒飄散。天地之間我與這敬亭山久久相對而互不厭倦，唯有敬亭山能夠完全理解我李白的孤傲胸懷！", "explain": "李白晚年漂泊孤寂時所作。以擬人手法將敬亭山化為靈犀相通之知己，透射出超凡出塵的傲骨與孤獨之美。"}, "彈琴": {"trans": "清脆悠揚的琴音在七根琴絃上流淌，靜靜聆聽有如松林寒風呼嘯般的清冽。這種古樸雅正的高古調子雖然自我深愛，可惜當今世上的人們大多早已不再彈奏了。", "explain": "劉長卿借古調不再流行寄寓知音難覓的感傷，借琴聲寄託自身不同流合污、潔身自好之高尚操守。"}, "夜宿山寺": {"trans": "這座高聳入雲的古寺樓臺高達百丈，彷彿一伸手就能摘下夜空璀璨的星辰。站在高處我不敢大聲說話，生怕驚擾了九天之上的神仙！", "explain": "李白以童心未泯的奇特遐想與誇張手法，生動再現山頂寺院高插雲霄的非凡氣勢。"}, "新嫁娘": {"trans": "新婚過後第三天走進廚房，洗淨雙手親自做羹湯。因為還不熟悉婆婆平日的口味習慣，便先請小姑子先品嘗一勺看看合不合適。", "explain": "王建截取新娘初入夫家的微妙心理與生活細節，刻畫了一位聰敏、溫順、謹慎操持家務的古代新娘形象。"}, "怨情": {"trans": "美麗的女子輕輕捲起珍珠簾幕，獨自坐在深閨之中緊蹙著纖秀雙眉。只見她白皙臉龐上滿是晶瑩的淚痕，卻不知她心中究竟在怨恨思念著誰呢？", "explain": "李白以白描筆法勾勒閨中幽怨美人的情態，留白深長，言有盡而意無窮。"}, "伊州歌": {"trans": "快快打落樹頭歡鳴的黃鶯兒吧，莫要任由牠在枝頭啼叫不休！牠的啼鳴驚擾了我的好夢，讓我無法在夢中飛到遙遠的遼西與征戰的夫君相聚！", "explain": "全詩巧用逆向構思，把對遠方征夫的刻骨相思化作對黃鶯啼鳴的嬌嗔責怪，情感真切動人。"}, "池上": {"trans": "天真可愛的小孩童獨自撐著一隻小舟，悄悄採下白蓮花歡喜帶回。孩童不懂得隱藏自己的行蹤，池塘中的浮萍早已被小艇劃開成了一道長長的碧痕！", "explain": "白居易以無比溫柔的筆調捕捉孩童的天真爛漫與稚氣淘氣，如同一幅栩栩如生的水墨江南童趣圖。"}, "江南": {"trans": "江南水鄉正是採蓮的美好季節，碧綠的蓮葉多麼茂盛舒展啊！魚兒在蓮葉間嬉戲穿梭：一會兒游到東面，一會兒游到西面，一會兒游到南面，一會兒游到北面。", "explain": "漢樂府最具代表性的抒情歌謠。複沓句法宛如歡快跳躍的音符，生動呈現江南採蓮男女勞作時的蓬勃生機。"}, "送陸判官往琵琶峽": {"trans": "在這水鄉秋風肅殺的夜晚，實在不是我們這般好友遠道惜別的時刻。長安城如同一場遙遠的夢境，究竟何時才是我們歸鄉相聚的佳期呢？", "explain": "李白送別友人之作，融秋江客愁與長安故園之思於一爐，蒼涼深摯。"}, "秋夜寄邱員外": {"trans": "我思念遠方的您正值這清冷的秋夜，獨自漫步長吟在這涼爽的天地間。空寂山林中松子紛紛掉落，我想幽居遠方的隱逸好友您，此時也該尚未入眠吧！", "explain": "韋應物以清朗疏淡之景抒發對老友的深沉憶念，松子落山之空靈動靜，盡顯山水名家之化境。"}, "玉階怨": {"trans": "白玉石階上早已凝結起清冷的秋露，長久伫立夜風悄然侵濕了薄薄的羅襪。無奈地放下晶瑩如水的水晶珠簾，隔著簾瓏凝望夜空中那一輪皎潔秋月。", "explain": "李白無一「怨」字而字字含怨，以白露浸襪、卻簾望月之細膩舉動，傳神刻畫宮人無邊落寞。"}, "塞下曲": {"trans": "夜色漆黑一群大雁驚恐飛高，原來是敵軍單于趁夜倉皇逃跑。將軍正要率領輕捷騎兵飛馳追擊，紛飛的鵝毛大雪已落滿了弓箭與鋼刀！", "explain": "盧綸邊塞名篇。大雪滿弓刀的雄壯畫面，定格了唐代邊防將士英勇威武、嚴陣以待的豪邁氣概。"}, "登樂遊原": {"trans": "傍晚時分心情略感不適，便驅車登上長安城外的樂遊原。夕陽晚照無限美好壯麗，只可惜天色已經接近黃昏落幕了。", "explain": "李商隱登高攬勝有感。既讚歎夕陽餘暉之絕美，又深藏盛唐繁華不再、日薄西山之深層歷史滄桑感。"}, "鹿柴": {"trans": "空曠寂靜的山中看不見一個人影，只能隱隱聽見遠處傳來若有若無的人語回聲。夕陽的餘暉穿透密林深處，又重新返照在綠茸茸的青苔之上。", "explain": "王維將「空山」之幽、「返景」之明結合，以聲襯靜、以光破暗，達到禪意與自然交融之至高造詣。"}, "劍客": {"trans": "十年辛苦磨礪鍛造這一柄寶劍，吹毛立斷的霜雪利刃至今尚未曾試鋒芒。今天特地將此寶劍展現給您看，世間若有不公不平之事，我願仗劍相平！", "explain": "賈島借詠劍自抒抱負，表現俠肝義膽與滿懷才華渴望為國為民效力的浩然正氣。"}, "問劉十九": {"trans": "新釀成未濾的米酒泛著綠色細微泡沫，紅泥塗抹的小火爐正燒得溫暖紅旺。天色向晚天空中似乎正要飄起初雪，能來寒舍共飲這杯暖酒嗎？", "explain": "白居易晚年名篇。透過火爐、新酒與晚雪營造出無比溫馨親切的家庭氛圍，友誼純真醉人。"}, "四氣": {"trans": "春天鳥兒還在啼鳴競相婉轉，夏日樹木忽已交織成濃密濃蔭。不知不覺秋山已漸行漸遠，俄頃之間又驚覺冬日霰雪已深厚降臨。", "explain": "雍裕之以寥寥二十字概括春夏秋冬四時流轉，感歎光陰飛逝如白駒過隙，意蘊警策。"}, "哥舒歌": {"trans": "北斗七星高懸在塞外天際，大將軍哥舒翰深夜仍佩帶寶刀巡營。直到如今敵軍騎兵只敢在遠處窺伺戰馬，再也不敢越過邊防重鎮臨洮！", "explain": "西北邊民讚頌哥舒翰威震邊陲的豪邁民歌，節奏剛勁昂揚，流露真摯的愛戴之情。"}, "梅花": {"trans": "在牆角避風處生長著幾株寒梅，冒著嚴寒獨自迎風盛開。遠遠望去便知道那晶瑩純白不是積雪，因為正有幽雅的暗香隱隱隨風襲來。", "explain": "王安石借凌寒傲雪之梅花自喻，象徵在艱險環境中堅持崇高理想、堅貞不屈的君子品格。"}, "不第後賦菊": {"trans": "等熬到了秋天九月八日重陽將至，我的菊花一旦盛開百花都將黯然凋零。那衝天的香氣將貫穿整座長安古都，滿城都將披掛上燦爛輝煌的黃金戰甲！", "explain": "黃巢屢試不第後所賦，氣魄凌雲、意象雄偉，隱含驚天動地的變革豪情與傲骨。"}, "七步詩": {"trans": "鍋底下燃燒著豆莖作為薪柴，鍋裡煮著的豆子在沸水中痛苦哀泣。我們原本就是同一根莖長出來的骨肉兄弟，今天為何要相殘相煎得如此緊迫狠心呢！", "explain": "曹植在生死逼迫下以豆萁煮豆為喻，詞鋒機敏沉痛，痛斥手足相殘之悲劇，感人肺腑。"}, "登幽州臺歌": {"trans": "往前看去見不到古代求賢若渴的聖賢明君，向後望去也看不到未來能理解我的明達之士。想到這天地是如此遼闊浩瀚永恆無窮，我獨自一人感到悲愴哀涼而禁不住淚水漣漣！", "explain": "陳子昂登臨薊北幽州臺，撫今追昔，唱出了千古士人懷才不遇、直面宇宙蒼茫之絕世孤獨悲歌。"}, "清明": {"trans": "清明時節細雨綿綿飄落不絕，行經途中的遊子心神淒迷欲斷魂。請問哪裡才能找到買酒驅寒歇息的小店呢？只見騎牛的牧童遙遙指向遠處盛開的杏花村。", "explain": "杜牧描寫清明節氣的千古絕唱。情景相生，將春雨惆悵與杏花村的明麗生機熔鑄為一體。"}, "花影": {"trans": "重重疊疊的花朵幽影攀爬到了玉臺之上，幾番叫僮僕拿掃帚去揮掃也無法將它掃除。剛被西下的太陽帶走收拾乾淨，卻又被剛剛升起的明月重新送了過來！", "explain": "蘇軾借揮之不去的花影設喻，既寫物象之趣，又寄寓世間小人讒言如影隨形、難以盡絕之諷喻。"}, "金縷衣": {"trans": "勸勉郎君莫要過度珍惜那華麗的名貴金縷衣，勸勉郎君應當萬分珍惜美好的青春韶華。鮮花盛開正合時宜之時就應當折取，切莫等到花兒落盡了才去枉折空空的枯枝！", "explain": "杜秋娘著名勸學感時之作，比喻精妙，情真意切，警惕世人把握當下韶光與奮進良機。"}, "渡漢江": {"trans": "流放嶺南多年音訊書信斷絕，歷經了寒冬又度過了春回大地。如今越是接近故鄉心情越發忐忑膽怯，甚至不敢主動開口向迎面而來的故鄉人詢問家裡的情況。", "explain": "宋之問寫流放歸途中「近鄉情更怯」之微妙心理，真切再現遊子久別重返時百感交集的恐懼與期待。"}, "遊子吟": {"trans": "慈愛的母親手中拿著針線，為即將遠行的遊子縫製身上的衣裳。臨行前密密麻麻地細細縫合，內心深處唯恐兒子此去經年遲遲難歸。有誰能說得清做兒女如寸草般微小的孝心，能夠報答得了母親那浩大如春日陽光的厚愛恩情呢！", "explain": "孟郊以至真至純之筆讚頌母愛，樸素無華卻撼動天地，為千百年來謳歌慈母之第一經典。"}, "涼州詞": {"trans": "黃河彷彿奔騰遠上白雲之端，那一座孤零零的邊防戍城矗立在萬仞高山之中。何必要用羌笛吹奏那幽怨傷感的《折楊柳》曲調呢，春天的春風原本就吹度不過這高高的玉門關啊！", "explain": "王之渙將邊塞黃河之雄闊蒼茫與戍邊將士遠隔春風之悲慨完美交織，格調高亢悲壯。"}, "早發白帝城": {"trans": "清晨告別了彩雲繚繞間高聳的白帝城，千里迢迢的江陵在一天之內就能乘舟歸返。長江兩岸猿猴悲啼的聲音還在耳邊不斷迴響，輕快的舟船早已穿過了萬座重重疊疊的青山！", "explain": "李白遇赦得釋東歸時之絕作，流瀉出驚人的速度感與喜獲新生的痛快淋漓，筆墨神采飛揚。"}, "長安秋望": {"trans": "樓閣高高聳立在覆霜樹林之外，清澈碧空萬里無雲澄澈無比。巍峨的終南山與明淨的秋光交相輝映，山色與秋色雄渾壯麗彼此競相拔高！", "explain": "杜牧登樓秋望，筆致高邁雄健，寫盡了秋日長安古都的廣闊乾坤與磅礡氣象。"}, "九月九日憶山東兄弟": {"trans": "我一人孤獨漂泊異鄉作為異客，每每遇到佳節良辰便加倍思念故鄉骨肉至親。遠遠推想家鄉的兄弟們今天也必定登高遠眺，在插滿茱萸之時定會感嘆唯獨少了我李白一人！", "explain": "王維十七歲客居長安時所作。以逆推設想對方思念自己的絕妙構思，寫盡佳節思親之痛徹肺腑。"}, "秋夕": {"trans": "銀白的燭光映照著冰冷的畫屏，宮女手拿著輕軟的羅絹小扇撲打著飛舞流螢。夜幕下天階的石板色澤微涼如水，無奈地倚臥遙遙凝望天河相望的牽牛織女二星。", "explain": "杜牧描寫失寵深宮宮女的淒清生活，情調清幽宛轉，流螢與星漢相襯，寄託無盡悵惘。"}, "赤壁": {"trans": "殘破的折斷鐵戟沉沒在江沙中歷經歲月尚未鏽蝕銷融，自己拿來重新磨洗依稀認出那是三國前朝的兵器。倘若當年周瑜未能借助有利的東風火燒戰船，那麼銅雀臺深處恐怕早已深鎖了東吳大喬小喬二位佳人了！", "explain": "杜牧借一件三國遺物翻出不落窠臼之歷史公案，諷喻英雄成敗之機遇與歷史之偶然性。"}, "飲湖上初晴後雨": {"trans": "晴朗的日子裡西湖波光蕩漾閃爍分外嬌好，下雨的時候山色空濛迷茫奇麗無比。如果要把這秀麗的西湖比作絕代佳人西施，那麼無論淡施脂粉還是濃施粉黛，都是那樣的合宜動人！", "explain": "蘇軾以西施比西湖，神來之筆流傳千古，「西子湖」雅號遂名揚天下，藝術構思精巧非凡。"}, "逢入京使": {"trans": "回頭遙望東方的故鄉道路漫漫漫長，思鄉的淚水止不住流淌打濕了雙袖龍鍾。在馬背上匆匆相逢身邊沒有紙墨筆硯，只能託付您回長安時替我口頭帶個信給家人報聲平安！", "explain": "岑參出塞途中偶遇回京使者，真情流露於匆促片刻，質樸親切，感染力經久不衰。"}, "江南逢李龜年": {"trans": "當年我在岐王王府的宴席裡常與您相見，在崔九堂前也曾無數次聆聽您的妙音。如今江南正是風景最美麗的春天，沒想到在這繁花飄零的遲暮歲月，竟又與您意外重逢！", "explain": "杜甫晚年名作。四句詩囊括開元盛世之繁華與安史之亂後之飄零，被譽為「一曲杜詩之絕唱」。"}, "登岳陽樓": {"trans": "很久以前便聽聞洞庭湖浩瀚之名，今日終於登上了岳陽樓頂。吳國楚國被這萬頃巨浪分割開來，整個乾坤天地彷彿都在湖水日夜浮動搖晃。戰亂中親朋故舊音訊全無，老病殘軀中只剩下一隻孤舟伴隨。邊關以北戰火烽煙依舊不絕，倚著欄杆我禁不住老淚縱橫長流！", "explain": "杜甫五言律詩巔峰之作，意境雄渾壯烈，個人老病之悲與國家山河之痛融為一體，感人至深。"}, "元日": {"trans": "在熱鬧的劈啪爆竹聲中舊的一年過去了，和煦的春風把暖意送入了新飲的屠蘇美酒之中。朝陽升起照耀著千家萬戶，人們紛紛把嶄新的桃符換下了門上的舊符。", "explain": "王安石描繪宋代春節除舊佈新的喜慶生機，洋溢樂觀進取的政治抱負與生機勃勃的氣象。"}, "濟源寒食-其五": {"trans": "長安城裡的落花被狂風捲得飛入雲霄，順著溫暖南風徑直飄到了天子前殿。可憐這春意盎然的萬物還知道去朝見君王，唯有我一人孤獨在渭水邊痛苦沉吟。", "explain": "孟郊借寒食落花諷刺世俗爭名逐利，抒發自己懷才不遇、淪落天涯之憤懣孤清。"}, "八陣圖": {"trans": "名震天下的諸葛亮輔佐劉備，功績雄蓋了三分天下的蜀漢；創製出深奧莫測的八陣圖，使名聲千秋永垂。長江滔滔江水終究衝不轉灘頭堅立的石堆陣法，令人遺恨萬分的是劉備未能聽從勸諫吞併東吳！", "explain": "杜甫登臨峽江八陣圖遺址，緬懷諸葛孔明的豐功偉績與悲劇遺恨，詞意沉鬱跌宕。"}, "賈生": {"trans": "漢文帝求賢若渴特地宣召貶謫之臣賈誼入宮，賈生的卓絕才華在當世無人可比。令人歎息的是文帝半夜促膝深談甚至身移前席，竟然不向賈生詢問天下蒼生疾苦，反而只是一味打聽鬼神迷信！", "explain": "李商隱藉漢文帝訪賈誼詠史諷今，抨擊晚唐帝王沉溺求仙鬼神而不顧國計民生，諷刺深刻入骨。"}, "山行": {"trans": "順著高聳寒山間迂迴曲折的石板小徑向上攀登，在白雲繚繞縹緲的深處隱隱住著幾戶人家。停下車馬只因喜愛這楓林傍晚的瑰麗景色，那經霜的秋楓紅得勝過了二月嬌艷春花！", "explain": "杜牧反轉傳統傷春悲秋之套路，熱情讚頌深秋楓葉經霜尤艷之頑強生機，意境高遠爽朗。"}, "夜上受降城聞笛": {"trans": "回樂峰前的黃沙白茫茫宛如冬雪，受降城外的夜月慘澹清涼正如重霜。不知在城外何處隱隱吹響了淒涼的蘆管羌笛，惹得這一夜的所有遠征將士全都望向故鄉！", "explain": "李益以如雪如霜的邊關冷月與穿透夜空的笛聲，極力渲染邊塞將士徹骨的思鄉之痛。"}, "寒食": {"trans": "春日京城長安處處飛舞著繽紛落花，寒食節的東風輕輕拂過御花園中的楊柳斜倚。夜幕降臨時漢宮禁苑特賜權臣蠟燭分發，輕柔的青煙飄散進入了五侯王孫貴胄之家。", "explain": "韓翃以工麗筆調描摹長安春景與宮闈特權，表面承平綺麗，內蘊微言大義之諷刺諷喻。"}, "絕句": {"trans": "兩隻黃鸝在翠綠的楊柳枝頭清脆鳴叫，一行白鷺展翅飛向高遠蔚藍的青天。憑窗遠眺可望見西嶺積雪覆蓋的千年雪山，門口水路上停泊著準備啟程航往萬里之外東吳的客船。", "explain": "杜甫浣花溪草堂名作。四句詩勾勒出四幅色彩明麗、對仗極其工整之錦繡春景，格局雄闊大氣。"}, "雲": {"trans": "一朵朵白雲飄飛而來安靜而自在，剛登上樓頭轉眼又翻越到了後山之前。在晴空中整日飄零也不曾散去回返，就這樣點綴貼破了那萬里澄澈明淨的碧空晴光。", "explain": "鄭準以敏銳生動的筆觸賦寫白雲游弋，將閒雲野鶴般的空靈情致描摹得妙趣橫生。"}, "山居夏日": {"trans": "綠樹茂密林蔭深濃夏日的白晝特別漫長，精美的樓臺在清澈池塘中投下秀麗的倒影。微風吹拂水晶簾幕輕輕搖曳晃動，滿架盛開的薔薇花散發出一整個庭院的馥郁芬芳！", "explain": "高駢以明麗優雅的筆觸描摹初夏山居景緻，動靜相生，色香味俱佳，令人心曠神怡。"}, "憶江上吳處士": {"trans": "您揚起風帆遠赴閩地，夜空中的月輪已幾番圓缺變化。秋風蕭瑟吹拂著渭水之波，紛飛的落葉落滿了整個長安。當年我們在此歡聚一堂的傍晚，雷雨交加寒意逼人。如今您的蘭木舟楫仍未歸來，唯有微渺的音信隱沒在渺茫的海雲之端！", "explain": "賈島「秋風吹渭水，落葉滿長安」為千古傳頌名句，融情入景，營造出高古清寒、無盡相思之意境。"}, "贈劉景文": {"trans": "荷花落盡再也沒有那如同高擎著遮雨的翠綠荷蓋，菊花凋謝依然傲立著不畏霜寒的剛勁傲骨。一年之中最美好難忘的景緻您一定要牢牢記取，那就是金橙燦黃、綠橘正香的金秋時節！", "explain": "蘇軾勉勵好友劉景文之作。借傲霜之菊與橙黃橘綠，比喻人應當珍惜晚年才智、保持堅貞操守。"}, "嫦娥": {"trans": "雲母鑲嵌的精美屏風深處燭影搖曳，天際的銀河漸漸西落啟明星正逐漸沉沒。廣寒宮中的嫦娥此時此刻應當無比後悔偷吃了長生不老的仙藥吧，落得在這無垠的碧海青天之中夜夜孤寂淒寒！", "explain": "李商隱借神話寄託求仙無著、知音難遇的心靈孤絕，語言精緻瑰麗，情感深沉淒迷。"}, "山居秋暝": {"trans": "空曠的山林刚刚迎來一場秋雨洗禮，傍晚時分涼意襲人帶來秋天的清爽氣息。皎潔的明月穿透松林枝葉灑落柔光，清冽的泉水在溪石之上淙淙流淌。竹林深處傳來浣紗歸來村女的歡聲笑語，蓮葉搖擺擺動原來是順流而下的漁船。任憑春天的芳草隨風枯萎歇息，秋山如此純美純潔，隱者王孫自可久久留居！", "explain": "王維山水田園詩之壓卷之作，動靜交輝、有聲有色，把高潔情操與隱居之樂描繪得如仙境畫卷。"}, "勸學詩": {"trans": "青春年少很容易轉瞬老去而學問卻極其難以成就，縱使是一寸短短的光陰也千萬不可以輕忽浪費。池塘邊春草如茵的美夢尚未完全驚醒，石階前梧桐落葉已然傳來了深秋肅殺的風聲！", "explain": "朱熹勸勉後生晚輩當惜時如金、勤勉求學，比喻生動警策，具有深遠的教育激勵意義。"}, "芙蓉樓送辛漸": {"trans": "迷濛的冷雨連綿漫江在深夜灑入了吳地，清晨送別摯友唯見楚山一抹孤傲聳立。到了洛陽如果親朋好友詢問起我王昌齡的近況，就請您告訴大家：我依然保持著一片純潔晶瑩如玉壺之冰心！", "explain": "王昌齡以「一片冰心在玉壺」明志，展現即使身處逆境貶謫之中，依然不染塵俗、光明磊落的高風亮節。"}, "子夜四時歌-春歌": {"trans": "秦地美麗的羅敷女子，在清澈的綠水之畔採摘著柔桑。潔白如雪的素手拂過青翠柔軟的枝條，臉上淡抹的紅妝在明媚春日下分外嬌艷。蠶兒飢餓了妾身必須趕快歸去，路過騎乘五馬的貴人們切莫在此流連不走！", "explain": "李白借古代樂府民歌古題，塑造了一位勤勞端莊、自尊自愛的江南蠶桑少女形象。"}, "子夜四時歌-夏歌": {"trans": "廣闊的鏡湖綿延三百里之遠，池中菡萏正怒放著嬌艷的荷花。五月裡越女西施在此採摘蓮花，圍觀觀賞的遊人擠滿了小小的若耶溪。她急忙泛舟歸去不等到月光升起，早早回到了越王的宮中。", "explain": "李白描寫若耶溪夏日採蓮與西施傳奇，意境明媚活潑，充滿浪漫縹緲的吳越風情。"}, "子夜四時歌-秋歌": {"trans": "長安古都籠罩在無垠澄澈的秋月之下，千家萬戶傳來了婦人為征夫趕製冬衣的陣陣砧杵之聲。那秋風吹拂吹之不盡，每一陣風裡都盛滿了對遠在玉門關征夫的刻骨思念。究竟到了哪一天才能徹底平定邊患胡虜，好讓我的夫君早日結束這漫長的遠征呢！", "explain": "李白名篇。萬戶擣衣之聲化為思婦共同之心聲，融家國安危與兒女柔情於一爐，博大深沉。"}, "子夜四時歌-冬歌": {"trans": "明天一早邊關驛使就要動身出發，妻子徹夜不眠加緊為征夫絮好保暖的寒袍。凍僵的素手抽動著冰冷的鐵針，哪裡還能禁受得住那冰冷剪刀的寒刺。將這縫製好的冬衣寄往遙遠邊疆，不知何日才能送達到那苦寒的臨洮邊關啊！", "explain": "李白生動再現寒冬深夜思婦趕製棉衣的深情，體貼入微，催人淚下。"}, "金鄉送韋八之西京": {"trans": "好友您從繁華長安遠道而來，如今又要動身重回長安故都。那呼嘯的狂風牽動著我深切的心緒，彷彿一路隨您向西高高懸掛在咸陽古樹之上。這份真摯離情難以用言語盡情表達，此番分別不知何年何月才能再度相遇。我極目遠眺已看不見您的身影，唯見重重疊疊的青山升起了蒼茫的煙霧！", "explain": "李白「狂風吹我心，西掛咸陽樹」以奇特瑰麗之想像抒發離思，豪氣之中飽含深情。"}, "觀書有感": {"trans": "半畝見方的小池塘如同展開了一面晶瑩明鏡，天上燦爛的陽光與潔白的雲影一同在水面徘徊倒映。請問這池塘為何能夠保持得如此清澈潔淨呢？只因為源頭一直有源源不絕的清澈活水不斷注入流淌進來啊！", "explain": "朱熹將治學讀書之深奧哲理寄託於池塘活水之生動比喻，寓意人唯有不斷吸納新知識方能思維常新。"}, "終南別業": {"trans": "人到了中年以後特別崇尚修道求真，晚年時便把家安置在了終南山的山腳之畔。興致來時常常獨自一人悠閒漫步，其中的種種妙趣唯有自己心中暗暗知曉。信步漫行不知不覺走到了溪水的源頭盡處，便索性坐下來靜靜觀看白雲悠悠升起。偶然在山林中遇到砍柴的老翁，便與他相伴談笑風生而忘記了歸去的時辰。", "explain": "王維晚年自得禪趣之名篇，「行到水窮處，坐看雲起時」成為無數文人達觀處世的精神寄託。"}, "歸園田居": {"trans": "在南山的山腳下開墾種植豆苗，野草生長得極為茂盛而豆苗卻顯得稀稀疏疏。清晨早早起身去田間清理雜草荒草，直到夜色降臨才頂著月光扛著鋤頭歸家。歸途的山路狹窄草木瘋長，傍晚冰冷的夜露打濕了我的衣裳。衣服打濕了原本就微不足道並不值得惋惜，只要能讓我順遂本心、不違背隱逸自然的初衷便足夠了！", "explain": "陶淵明代表作。真摯描摹田園躬耕勞作之甘苦，展示其不與污濁官場同流合污的高尚人格。"}, "月夜": {"trans": "今夜鄜州夜空懸掛著明月，妻子在深閨之中必定只能獨自一人淒涼觀看。我遠在異鄉深深憐憫那年幼的兒女，他們年紀尚小還不懂得思念遠在長安的我。夜霧瀰漫打濕了妻子烏黑的鬢髮，清冷的月輝照映在她潔白如玉的手臂上令人覺寒。不知何時才能與妻子重聚倚靠在虛薄的帷幔旁，讓月光同時照亮我們二人，把思念的淚痕一同照乾！", "explain": "杜甫身陷長安叛軍圍困時思念妻子之作。設身處地想像妻子望月思夫之深情，淒惻溫存，感人至深。"}, "賦得古原草送別": {"trans": "遼闊的原野上青草茂密繁盛，歷經一年一度的一枯一榮。哪怕無情的野火將它徹底焚燒也絕不能燒盡，待到溫暖的春風吹拂而來它又會重新勃發繁衍。遠遠的芳草芬芳侵入了古老的大道，晴光下青翠的碧色連接到了荒涼的城垣。在此又一次送別王孫好友遠行，那滿目萋萋的荒草正如滿懷離別依依深情！", "explain": "白居易十六歲時一舉成名之應試之作。「野火燒不盡，春風吹又生」成為頑強生命力的永恆讚歌。"}, "初春小雨": {"trans": "京城天街上飄灑著如酥油般細潤的小雨，早春的草色遠遠望去隱隱約約一片青綠，可走近細看時卻又似有似無。這正是一年之中最美好迷人的早春勝景，遠遠勝過那暮春時節煙柳堆煙籠罩整座皇都的光景啊！", "explain": "韓愈精微捕捉初春極其微妙之綠意，以「草色遙看近卻無」名垂千古，清新淡雅，妙手偶得。"}, "旅夜書懷": {"trans": "微風輕拂著岸邊細柔的青草，江中危聳著桅杆停泊著一隻孤獨的夜舟。星辰低垂在遼闊平坦的曠野之上，明月躍起於奔騰滾滾的滔滔大江之中。我難道是因為詩篇文章才得以聞名於世嗎？為官的仕途早已因年老多病而應當罷休。漂泊一生的我究竟像個什麼呢？只不過是這浩渺天地之間一隻孤獨翻飛的沙鷗罷了！", "explain": "杜甫晚年自四川出峽時的千古絕唱。以天地遼闊之大景襯托個體漂泊之孤舟沙鷗，悲壯蒼茫到了極致。"}, "過故人莊": {"trans": "老朋友備下了豐盛的黃米飯和雞肉，熱情邀請我來到他的田家做客。翠綠的樹木緊緊環抱著村莊，青翠的遠山在城郭之外逶迤橫斜。打開窗軒正對著農家的打穀場與菜園，舉起酒杯開懷暢談著桑麻農事。等到九月九日重陽節的那一天，我一定還要再來這裡品嘗美酒、欣賞怒放的金菊！", "explain": "孟浩然田園詩之代表作。平淡質樸如家常話，卻洋溢出無比深厚真摯的田園友情與生活情趣。"}, "望月懷遠": {"trans": "浩瀚的大海之上湧現出一輪明月，天涯海角的有情人在這一刻共同凝望著這同一個夜空。有情人總是埋怨這漫漫長夜是如此幽深漫長，整整一夜都難以遏止胸中那翻騰的相思深情。吹滅蠟燭更加憐愛這滿室皎潔的月色，披上外衣更覺得夜露深沉滋潤。月光縱美卻無法滿手捧取贈送給遠方的你，還是回到寢室期望能在美夢中與你共赴佳期吧！", "explain": "張九齡「海上生明月，天涯共此時」為唐代望月懷人詩之頂峰，意境高朗宏大，感情纏綿悱惻。"}, "夜雨寄北": {"trans": "您頻頻問起我何時歸去，而我歸去的日期實在遙遙無期無法確定；此時此刻巴山正下著綿綿夜雨，漫漲了秋天的池塘。不知到了哪一天我們才能再度相聚，一同坐在西窗下一邊剪著燭花，一邊細細訴說今夜巴山聽雨時的無盡思念呢！", "explain": "李商隱借時空錯落對調之精妙手法，把眼前的羈旅孤悽化作未來的重逢暢敘，深情無限。"}, "楓橋夜泊": {"trans": "月亮西落烏鴉啼叫寒霜灑滿了夜空，江邊的楓樹與漁舟的燈火伴隨著作客的旅人愁苦入眠。姑蘇城外那古老的寒山寺院，深夜敲響的鐘聲悠悠傳到了遊子的客船！", "explain": "張繼千古傳世名篇。客船、霜天、夜半鐘聲交織出孤寂悠遠的意境，使寒山寺成為世界文學之文化地標。"}, "題西林壁": {"trans": "從正面橫看是一道連綿的山嶺，從側面眺望又是一座挺拔的孤峰，無論從遠處、近處、高處、低處觀看都各不相同。我之所以不能看清認清這廬山的真實面目，只因為我整個人就身處在這重重的大山包圍之中啊！", "explain": "蘇軾以深入淺出的哲理入詩，「不識廬山真面目，只緣身在此山中」道盡了當局者迷、旁觀者清的深奧哲思。"}, "出塞": {"trans": "頭頂依然是秦漢時期的明月，腳下依然是秦漢時期的邊關，歷朝歷代萬里遠征的將士卻往往長眠塞外未能歸家。倘若龍城飛將軍李廣如今依然健在，定然不會容許外敵胡人的騎兵度過這陰山之巔！", "explain": "王昌齡七言絕句之冠冕。慷慨激昂，融歷史沉思與對名將之渴求於一爐，被後世推為唐人七絕壓卷之作。"}, "月下獨酌": {"trans": "在美麗的花叢之中擺放著一壺美酒，我獨自一人自斟自飲身邊沒有知己相親。索性舉起酒杯熱情邀請天上的明月，再加上自己地上的倒影便湊成了三人同歡。明月雖然根本不懂得暢飲之樂，身影也只是徒然跟隨在我身旁走動。暫時且讓明月與身影做我的同伴吧，人生及時行樂正應當趁著大好春光！我唱歌時明月在天際留連徘徊，我起舞時身影也在地上翻飛零亂。清醒之時我們一同開懷暢飲交歡，喝醉之後便各自散去東西。願永遠與明月身影結下超塵絕俗的忘情幽遊，相約在遙遠縹緲的銀河仙境相見！", "explain": "李白浪漫主義詩歌之極致體現。把最徹底的孤寂化作最宏大的歡鬧狂歡，展示其獨立於世的非凡靈魂。"}, "觀游魚": {"trans": "繞著清澈的池塘悠閒漫步觀看魚兒游弋，正值村中小童划著釣舟在水中垂釣。同一種喜愛游魚的心情卻有著截然相反的表現：我來到池畔是為了拋撒食物餵養牠們，而你們孩童卻是為了垂下釣竿將牠們釣起。", "explain": "白居易以平易自然的白描揭示人對待生命的差異態度，富有哲理趣味與博愛慈悲情懷。"}, "贈別其二": {"trans": "聚會之時滿懷深情看起來反而像是全無感情一般，在離別的酒樽面前只覺得強顏歡笑也笑不出來。那案桌上的蠟燭似乎也懷有靈性深知離別之痛，竟然替我們離人默默流淌著淚水直到天明！", "explain": "杜牧擬人化蠟燭代人垂淚，將無形之離愁具象化為徹夜流淌的燭淚，纏綿深致，傳頌千古。"}, "聞官軍收河南河北": {"trans": "劍門關外忽然傳來了官軍收復薊北的捷報，剛剛聽聞捷報之時淚水早已濕透了衣裳！轉頭看看妻子兒女哪裡還有平日的愁苦，自己更是激動得隨意捲起詩書喜悅到了瘋狂的地步！在大白天裡我要放聲高歌縱情飲酒，趁著大好春光做伴正好啟程回返故鄉！立即從巴峽啟程穿過巫峽，轉眼便順流而下經襄陽直奔洛陽故園！", "explain": "杜甫「生平第一快詩」。疾風驟雨般的筆調噴薄出聽聞戰亂平息後的狂喜與愛國赤誠，痛快淋漓。"}, "泊秦淮": {"trans": "迷濛的煙霧籠罩著冰涼的江水，月光如水灑在岸邊的沙灘上，深夜我將客船停泊在靠近酒家繁華的秦淮河畔。那些賣唱的歌女哪裡知道亡國滅種的深沉悲恨，隔著江水依然在高唱著陳後主那亡國之音《玉樹後庭花》！", "explain": "杜牧借秦淮夜景痛陳晚唐統治者沉溺聲色、重蹈覆轍之危機，諷刺深邃，情調淒艷迷濛。"}, "登金陵鳳凰台": {"trans": "金陵鳳凰臺上曾有鳳凰自在遨遊，如今鳳凰早已遠去臺榭空空唯見長江滾滾奔流。昔日吳國的宮苑繁花芳草如今已淹埋在荒僻幽徑，晉代顯赫的風流士族冠冕早已化作荒涼的古老墳丘。三山聳立在青天之外若隱若現，長江二水在白鷺洲中分流奔馳。天際總有浮雲能夠遮蔽明媚的太陽，望不見長安帝都真使人愁緒滿懷！", "explain": "李白與崔顥《黃鶴樓》爭勝之千古名作。融歷史滄桑、自然山川與長安遠思於一爐，氣象萬千。"}, "勸學": {"trans": "敲擊堅石才會迸發出火星，如果不去敲擊原本就沒有一絲煙火。人唯有經過刻苦學習才能領悟大智慧，不努力學習是絕不可能自然通達真理的。世間萬事都必須仰仗自己的發奮運化，他人哪怕獲得成功也不代表是我自己的才能。青春韶華當抓緊及早奮發圖強，人的一生哪裡能夠永遠停留在年少時代呢！", "explain": "孟郊勉學名作。以石擊火設喻，說理透闢犀利，激勵少年當自立自強、勤奮向學。"}, "渭城曲": {"trans": "清晨渭城驛館的一陣薄薄細雨潤濕了地上的塵埃，客舍周圍青翠的楊柳顯得分外明麗清新。請好友您再次滿飲這杯醇厚的美酒，因為一旦向西走出了陽關邊隘，便再也沒有知心的故人老友了！", "explain": "王維送別名篇，後譜入琴曲稱《陽關三疊》。深情醇厚，真摯動人，成為千古送別詩之無冕之王。"}, "花非花": {"trans": "像花卻不是花，像霧又不是霧。在深邃夜半悄然降臨，天明破曉時分又悄然離去。來的時候宛如春日美夢一般能停留幾多時光呢？離去的時候正如清晨的朝雲不知所蹤、無處可尋。", "explain": "白居易以朦朧詩手法描繪夢幻般不可捉摸的美好物象與人生幻滅之感，語言清妙，意境深婉。"}, "明日歌": {"trans": "明天過後又是明天，世上的明天究竟是何其之多啊！我如果一生只知道等待著未來的明天，那麼萬般事情終究都會一事無成、磋跎荒廢。世上的人們全都被等待明天所拖累耽擱，春去秋來轉眼間垂垂老矣便已降臨。清晨看著江水向東滔滔流逝，傍晚看著落日向西沉淪下墜。人的一生能有幾百個明天呢？請諸位聽一聽我這首發人深省的《明日歌》吧！", "explain": "錢福名作。通俗易懂，朗朗上口，苦口婆心勸勉後人珍惜眼前時光、把握當下。"}, "錦瑟": {"trans": "美麗華貴的錦瑟不知為何無端擁有五十根弦，每一根琴弦、每一個柱位都令人深切追憶起逝去的韶華青春。莊周在清晨夢醒時迷惘分不清自己究竟是蝴蝶還是自身，望帝化為春心杜鵑啼血寄託無盡的哀思。浩瀚滄海在明月映照下珍珠彷彿有情人的眼淚，溫暖藍田在日照之下美玉生起嫋嫋的青煙。這般深情難道要等到今日才成為刻骨追憶嗎？只不過在當時身歷之際，早已是滿心茫然、惘然若失了啊！", "explain": "李商隱畢生詩作之總綱。錦瑟起興，典故繁複精緻，將人生終極的迷惘、追尋與幻滅推向最高藝術殿堂。"}, "贈孟浩然": {"trans": "我極其敬愛隱居襄陽的孟浩然夫子，他高雅風流的清逸名聲天下皆知。年輕韶華之時便甘心拋棄榮華仕途軒冕，年邁白首之際悠然安臥在青松白雲之間。醉心於美酒時常常獨得醉中之聖趣，沉迷於名花山水之中不願逢迎侍奉君王。他那高尚如同巍峨大山的品德叫人如何瞻仰追隨呢？我唯有在這山下虔誠向他作揖、敬仰他芬芳高潔的德馨！", "explain": "李白推崇孟浩然高潔隱士情操之頌歌。情真意切，語言純粹高雅，將詩人間的神交刻畫得淋漓盡致。"}, "虞美人": {"trans": "這春花秋月的美好良辰究竟何時才能了結？昔日帝王舊事又知曉多少！昨夜小樓之上又刮起了溫暖的東風，深陷囚牢的我怎堪回首遙望在明月中破滅的故國！昔日江南那雕花欄杆與玉石臺階應該依然矗立在那裡吧，只是故宮中宮人的紅潤容顏早已斑駁衰改。如果問我心中究竟有多少滔滔愁緒？那真正如同一整江浩蕩奔騰的春水，滾滾向東無休無止地流淌！", "explain": "李煜詞中神品。將抽象的亡國深恨化作滾滾春水，悲壯蒼涼，沈痛徹骨，成就千古詞帝美名。"}, "黃鶴樓": {"trans": "古代仙人早已乘著黃鶴飛天而去，如今這座空蕩蕩的江岸之城唯獨留下了這座古老的黃鶴樓。黃鶴一旦飛去便再也不曾重新回返，天邊千百年來的悠悠白雲徒然在長空空自漂泊。陽光下漢陽城中樹木蔥蘢歷歷在目，鸚鵡洲上的春草繁茂萋萋青綠。黃昏日落時分回首望向故鄉不知在何處呢？只見長江水面上浩渺的煙波瀰漫，真叫人滿懷離愁別緒！", "explain": "崔顥登樓千古絕唱。神話幻境與江山勝景相得益彰，李白見之擱筆，被譽為唐代七言律詩之第一。"}, "送友人": {"trans": "蒼翠的青山橫亙在北城之外，清澈的白水蜿蜒環繞著東城流淌。在這個地方我們二人就要作別分離了，朋友您將如同漂泊的孤蓬一般踏上萬里遠征。飄浮的白雲正如行蹤不定的遊子心意，落下的夕陽正如難捨難分的故人深情。揮一揮手就此離別踏上征途，兩匹即將分道揚鑣的駿馬發出了蕭蕭的離群嘶鳴！", "explain": "李白送別名篇。青山、白水、浮雲、落日、班馬鳴，畫面明朗生動，離情依依而不顯消沉。"}, "浣溪沙": {"trans": "填了一曲新詞飲上一杯美酒，眼前依然是去年的溫暖天氣和舊日亭臺，夕陽向西漸漸落下不知何時才能回轉？花兒無可奈何隨風飄零落下，似曾相識的燕子又輕盈飛回，獨自一人在小園落花香徑上默默徘徊。", "explain": "晏殊詞中名篇。名句「無可奈何花落去，似曾相識燕歸來」情致天然，將無奈感傷與生命哲理融為一體。"}, "水調歌頭": {"trans": "明月究竟從何時開始有的呢？我舉起酒杯遙遙問訊長空青天。不知九天之上的瓊樓玉宇，今夜又翻過了是哪一年。我真想乘著清風飛回那美麗的月宮，卻又唯恐那瓊樓玉宇太過寒冷高處不勝寒涼。翩翩起舞與清澈的身影嬉戲相伴，哪裡比得上在人間充滿煙火真情的美好呢！月光轉過了硃紅的樓閣，低低照在雕花門窗之內，照著無眠的離人。月亮原本不應當對人間有什麼怨恨吧，為什麼偏偏要在人們離別的時候才顯得如此圓滿呢？人世間自古有悲歡離合，月亮也有陰晴圓缺，這樣的事物自古以來就極難周全兩全。只願我們相愛相念的人能夠長長久久，縱使相隔千里萬里也能共同分享這同一輪美好月色！", "explain": "蘇軾中秋望月懷念胞弟蘇轍之作，豪邁奔放與哲理通達完美結合，胡仔讚其「中秋詞自東坡《水調歌頭》一出，餘詞盡廢」。"}, "天淨沙·秋思": {"trans": "枯藤纏繞著老樹上方黃昏歸巢的烏鴉啼叫，小巧的木橋下流水潺潺旁佇立著尋常人家，荒涼古道上迎著蕭瑟秋風行走著疲憊的瘦馬。夕陽已經漸漸西下沉落，無比悲傷斷腸的漂泊遊子，依然隻身一人流落天涯！", "explain": "馬致遠以二十八字純粹由名詞意象疊加，營造出秋郊夕照之極致荒涼與羈旅之悲，被譽為「秋思之祖」。"}, "輞川閒居贈裴秀才迪": {"trans": "寒山在落日暮色中轉為深沈的青翠，秋日溪水日夜潺潺地流淌。拄著手杖倚立在柴門之外，在迎面晚風中靜聽暮蟬的啼鳴。江邊渡口停留著殘存的夕陽餘暉，墟里炊煙嫋嫋升起孤單飄蕩。又遇到如同接輿般狂傲醉酒的好友裴迪，在五柳宅前放懷狂歌！", "explain": "王維隱居輞川別業時所作，詩情畫意與高士知己相映成趣，境界幽遠恬靜。"}, "飲酒": {"trans": "我把草廬房舍搭建在這人世間，耳邊卻完全沒有車馬喧鬧的煩擾。若要問我為何能夠達到這般超脫境界呢？只要自己內心高遠空靈，所處的地方自然就會變得偏遠清幽。在東籬之下悠閒地採摘菊花，抬頭無意間便悠然看見了終南南山。山林間夕陽西下的雲氣多麼美好，飛鳥成群結伴相伴飛回巢穴。這清純自然之中孕育著人生的真實旨趣，正想開口辨析明白，卻發現內心早已忘卻了言語之表達！", "explain": "陶淵明田園詩之代表作，「採菊東籬下，悠然見南山」超凡脫俗，達到了天人合一之極致妙境。"}, "登高": {"trans": "天高風急遠處峽谷傳來猿猴哀傷的長嘯，沙洲清冷江岸潔白飛鳥在風中盤旋迴轉。無邊無際的蕭蕭落葉漫天飄零紛紛落下，奔騰不息的滾滾長江萬里滔滔奔流而來！萬里奔波悲嘆深秋我常年身作異鄉異客，一生多病暮年時獨自登上這高高的危臺。備嘗艱難歷盡苦恨兩鬢已染滿了斑白繁霜，潦倒困頓之中又新近被迫停下了借酒消愁的濁酒杯！", "explain": "杜甫晚年登高絕作，被明代胡應麟譽為「古今七律第一」。八句皆對，情景交融，沈雄博大，氣蓋千古。"}, "蜀先主廟": {"trans": "天下第一英雄劉備的豪壯氣魄，歷經千秋歲月依然凜然長存！當年以大勢鼎立三分天下，克復漢室重鑄五銖漢錢。有幸得到諸葛孔明這樣的賢相開創基業，生下的後代阿斗卻無法繼承聖賢德才。令人淒涼的是昔日蜀漢宮廷裡的歌妓，如今卻被迫在魏國宮殿之前舞弄歡顏！", "explain": "劉禹錫借謁蜀先主廟詠史懷古，撫今追昔，讚頌劉備、孔明之英雄氣節，諷刺後主荒唐失國。"}, "蜀相": {"trans": "丞相諸葛孔明的祠堂究竟應當到哪裡去尋訪呢？就在錦官城外那柏樹蒼翠森森的地方。映照石階的碧綠青草自得春意盎然，隔著濃蔭的黃鸝鳥空自發出婉轉啼聲。三番登門懇請定下了平分天下的宏圖大計，歷經兩代開國濟世傾盡了老臣一腔赤膽忠心。只可惜出師大捷未曾奏效自己便先病死軍中，長久使得千百年來的天下英雄感動得淚濕沾襟！", "explain": "杜甫定居成都草堂時謁武侯祠所作，末二句成為古今志士仁人抱憾殉國時最深切的同聲一歎。"}, "生查子": {"trans": "去年元宵節的夜晚，花燈市場燈火通明燦爛如白晝；月兒升上了柳樹的枝梢頭頭，情人相約在黃昏之後相會。今年元宵節的夜晚，那一輪明月與繁華花燈依然如舊；卻再也看不見去年的心愛之人，止不住的思念淚水打濕了春天的衫袖！", "explain": "歐陽修名詞。物是人非之感傷以極其對比工整的時空對照呈現，含蓄深婉，動人心弦。"}, "無題": {"trans": "昨夜仰望滿天星辰昨夜迎著和煦春風，我们在畫樓西畔桂堂東面歡聚一堂。身上雖然沒有彩鳳那樣美麗的雙翼可以比翼雙飛，內心深處卻如通靈的犀牛之角那樣靈犀相通。宴席間隔著座位傳遞藏鉤猜拳美酒微醺，分組圍坐射覆遊戲映照著燭燈通紅。無奈天明聽到更鼓響起只得奔赴官職，身不由己策馬奔向蘭臺，就像隨風旋轉的蓬草一般身不由己！", "explain": "李商隱愛情名篇，「身無彩鳳雙飛翼，心有靈犀一點通」千古傳唱，把心心相印之戀情昇華至極致。"}, "長相思": {"trans": "汴河的水在長流，泗河的水在奔流，滔滔江水一直流淌到了瓜州古老的渡口之畔。遙遙望去吳地的群山彷彿點綴著無盡的愁緒。思念綿綿悠悠無盡，怨恨綿綿悠悠無休，這份思念與怨恨要直到夫君歸來之時才方能平息止休。明月當空之下，唯有孤單的一人倚立在高樓上默默凝望。", "explain": "白居易借流水與吳山詠嘆思婦相思，語言宛轉清新，疊字生輝，情真意切。"}, "西江月": {"trans": "皎潔明月驚動了枝頭棲息的喜鵲，清涼半夜微風吹拂傳來陣陣蟬鳴。在稻花芬芳的清香中人們談論著豐收的年歲，四處傳來一片歡快的蛙聲起伏。七八顆稀疏的星斗點綴在天外，兩三點零星的雨滴灑落在山前。循著舊日熟悉的道路走過茅店社林邊，小路轉過小橋忽然就出現在眼前！", "explain": "辛棄疾名篇。清新活潑，洋溢著豐收之喜悅與夏夜農村自然閒適的江南情趣。"}, "春望": {"trans": "國都長安淪陷於叛軍殘破不堪山河依然長存，春天京城之中草木雜草叢生深邃茂密。感傷時局繁花盛開也禁不住淚水漣漣，痛恨分別鳥兒啼鳴也使人內心驚懼。戰火接連燃燒了三個多月不熄，一封家鄉寄來的書信抵得過萬兩黃金。頭上的白髮越抓越稀疏短少，稀薄得簡直連一根髮簪都快插不住了！", "explain": "杜甫身陷長安時所作，「國破山河在，城春草木深」與「烽火連三月，家書抵萬金」為中華愛國詩歌第一金句。"}, "醜奴兒": {"trans": "少年年少時不懂得憂愁是何等滋味，喜愛登上一層層的高樓，喜愛登上一層層的高樓，為了寫出新穎的詩詞勉強裝作出滿腹愁緒。而如今飽經滄桑嘗遍了世間所有愁苦滋味，想要傾訴一番卻又欲說還休，想要傾訴一番卻又欲說還休，只是淡淡說了一聲：『天涼了，真是一個好秋天啊！』", "explain": "辛棄疾歷經坎坷後之感懷。少年強賦與暮年欲說還休之鮮明對比，道盡人生閱歷之無言深痛。"}, "臨江仙": {"trans": "滾滾長江向東滔滔奔流不息，江面上奔騰翻滾的浪花淘盡了古往今來多少風流英雄！是非成敗在歷史長河轉頭就化作一場虛空。唯有那巍峨青山依然矗立千古，在殘陽中幾度映照著夕陽彤紅。白髮蒼蒼的漁夫與樵夫生活在江渚之上，早已習慣了觀看秋月春風的四時變幻。在難得的相逢中開懷共享一壺濁酒，古往今來發生了多少紛紛擾擾的興亡舊事，全都付諸於這歡聲笑談之中了！", "explain": "楊慎詞中極品，後作為《三國演義》卷首開篇詞。意象宏大蒼茫，超然物外，以千古浩瀚胸襟包容歷史興衰。"}, "相見歡": {"trans": "無言以對默默一人獨自登上西樓，夜空中斜掛著一彎如銀鉤般的殘月。寂寞冷清的梧桐樹在深沉庭院之中，彷彿深鎖了整座清寒蕭瑟的深秋。那剪也剪不斷、理也理不清紛亂的，正是這撕心裂肺的離愁別恨。這是一番別樣獨特、難以言喻的苦澀滋味，長久長久縈繞在我的心頭！", "explain": "李煜亡國入宋後幽居深院所作，「剪不斷，理還亂，是離愁」精準道盡人生離別痛苦之糾葛無解。"}, "絕句_杜甫": {"trans": "兩隻黃鸝在翠綠的楊柳枝頭清脆鳴叫，一行白鷺展翅飛向高遠蔚藍的青天。憑窗遠眺可望見西嶺積雪覆蓋的千年雪山，門口水路上停泊著準備啟程航往萬里之外東吳的客船。", "explain": "杜甫浣花溪草堂名作。四句詩勾勒出四幅色彩明麗、對仗極其工整之錦繡春景，格局雄闊大氣。"}, "絕句_僧志南": {"trans": "在古樹青翠的陰涼中繫好了小船，手拄著藜杖攙扶著自己緩緩走過小橋向東漫步。絲絲小雨打濕衣裳那是杏花微雨的潤澤，迎面吹來的和煦微風一點也不感到寒冷正是楊柳春風！", "explain": "南宋僧志南描寫春雨微風的千古名作。詩句清新流麗，自然妥帖，傳遞出無限安詳喜悅。"}, "涼州詞_王翰": {"trans": "精緻珍貴的夜光杯中斟滿了醇香的葡萄美酒，正要縱情暢飲，馬上琵琶已急促催人出征。哪怕醉倒在這廣袤沙場上諸位君子也切莫見笑，自古以來奔赴沙場征戰的人，能有幾人活著回家呢？", "explain": "王翰以豪飲作別、笑對生死的狂放姿態，道出守塞軍士深沉的慷慨悲壯，境界極高。"}, "涼州詞_王之渙": {"trans": "黃河彷彿奔騰遠上白雲之端，那一座孤零零的邊防戍城矗立在萬仞高山之中。何必要用羌笛吹奏那幽怨傷感的《折楊柳》曲調呢，春天的春風原本就吹度不過這高高的玉門關啊！", "explain": "王之渙將邊塞黃河之雄闊蒼茫與戍邊將士遠隔春風之悲慨完美交織，格調高亢悲壯。"}, "月夜_劉方平": {"trans": "夜色漸漸深沉，半邊人家都沐浴在如水的皎潔月光之中；北斗星與南斗星在天際靜靜橫斜。今夜格外感受到春天萬物回暖的溫潤氣息，那輕柔的蟲鳴聲已悄悄透過了綠色的窗紗傳入耳來。", "explain": "劉方平以敏銳纖細的感覺捕捉春回大地的微妙徵兆，月色靜謐，蟲聲怡人，極具詩情畫意。"}, "月夜_杜甫": {"trans": "今夜鄜州夜空懸掛著明月，妻子在深閨之中必定只能獨自一人淒涼觀看。我遠在異鄉深深憐憫那年幼的兒女，他們年紀尚小還不懂得思念遠在長安的我。夜霧瀰漫打濕了妻子烏黑的鬢髮，清冷的月輝照映在她潔白如玉的手臂上令人覺寒。不知何時才能與妻子重聚倚靠在虛薄的帷幔旁，讓月光同時照亮我們二人，把思念的淚痕一同照乾！", "explain": "杜甫身陷長安叛軍圍困時思念妻子之作。設身處地想像妻子望月思夫之深情，淒惻溫存，感人至深。"}, "勸學_顏真卿": {"trans": "深夜三更點燈苦讀直到五更公雞啼曉，這正是男兒發奮刻苦讀書的大好時機。年少黑髮之時若不知道及早勤奮向學，等到年邁白髮蒼蒼之時再來後悔讀書太遲，可就悔之晚矣！", "explain": "顏真卿勉學格言詩。對仗嚴整，警句鏗鏘有力，成為中華民族歷代學子修身勉學的座右銘。"}, "勸學_孟郊": {"trans": "敲擊堅石才會迸發出火星，如果不去敲擊原本就沒有一絲煙火。人唯有經過刻苦學習才能領悟大智慧，不努力學習是絕不可能自然通達真理的。世間萬事都必須仰仗自己的發奮運化，他人哪怕獲得成功也不代表是我自己的才能。青春韶華當抓緊及早奮發圖強，人的一生哪裡能夠永遠停留在年少時代呢！", "explain": "孟郊勉學名作。以石擊火設喻，說理透闢犀利，激勵少年當自立自強、勤奮向學。"}, "浣溪沙_韋莊": {"trans": "夜夜漫長在刻骨相思中聽著銅壺滴漏漸漸殘破，滿懷傷心仰望明月倚靠在冰冷的欄干旁。深深懸念著遠方的您思念我時錦被是否感到寒冷。畫堂雖近咫尺卻深邃如同大海難越，追憶往事時唯有把當年的舊書反覆翻閱。不知何年何月才能與您攜手同行，一同返回繁華的長安故都呢？", "explain": "韋莊詞風清麗纏綿，把對戀人的相思深情與渴望重返長安的家國隱痛交融一體，耐人尋味。"}, "浣溪沙_晏殊": {"trans": "填了一曲新詞飲上一杯美酒，眼前依然是去年的溫暖天氣和舊日亭臺，夕陽向西漸漸落下不知何時才能回轉？花兒無可奈何隨風飄零落下，似曾相識的燕子又輕盈飛回，獨自一人在小園落花香徑上默默徘徊。", "explain": "晏殊詞中名篇。名句「無可奈何花落去，似曾相識燕歸來」情致天然，將無奈感傷與生命哲理融為一體。"}, "長相思_李白": {"trans": "長相思啊長相思，相思之人在繁華長安。紡織娘在秋雨初晴的雕花井闌邊啼鳴，微霜淒清薄簟泛起絲絲寒意。孤燈昏暗相思之情深入骨髓幾近欲絕，捲起帷幔仰望夜空明月唯有長長歎息，心中美人宛如天仙隔在雲端不可及。上方的青天是那麼高遠浩渺深不可測，下方的江水是那麼洶湧澎湃掀起波瀾。天長路遠靈魂飛越追尋是何等艱辛，連夢魂想要飛越重重關山也是這般艱難。這無休止的長相思啊，簡直要摧折揉碎了我整個心肝！", "explain": "李白樂府名作，情感汪洋恣肆，將對長安的政治理想與對知己的刻骨眷戀交織宣洩，痛徹心扉。"}, "長相思_白居易": {"trans": "汴河的水在長流，泗河的水在奔流，滔滔江水一直流淌到了瓜州古老的渡口之畔。遙遙望去吳地的群山彷彿點綴著無盡的愁緒。思念綿綿悠悠無盡，怨恨綿綿悠悠無休，這份思念與怨恨要直到夫君歸來之時才方能平息止休。明月當空之下，唯有孤單的一人倚立在高樓上默默凝望。", "explain": "白居易借流水與吳山詠嘆思婦相思，語言宛轉清新，疊字生輝，情真意切。"}, "青玉案": {"trans": "東風拂過在元宵夜裡吹開了滿城千樹燈花，彷彿更吹落了漫天的繁星如同急雨般落下。華麗的寶馬與雕飾精美的香車散發著香氣奔馳在街道上。鳳簫奏響清脆動人的旋律，玉壺般的明月流轉光華，整整一夜都有著璀璨的魚龍彩燈翩翩起舞。仕女們頭上插戴著雪柳、黃金絲縷的美麗頭飾，笑語盈盈帶著陣陣暗香遠去。我在茫茫人海燈火中尋覓尋找著心儀的她千百回；驀然間回首望去，沒想到那個人卻偏偏佇立在燈火稀疏冷落、無比恬淡的地方！", "explain": "辛棄疾名篇。以元夕狂歡熱鬧襯托「那人」幽居冷落處之高標獨立，寄託詞人潔身自好、不慕繁華之崇高人格。"}}};

    // Build flattened master list of all 123 poems
    const ALL_POEMS = [];
    STATIONS.forEach((st, stIdx) => {
      for (const [dyn, authors] of Object.entries(st.dynasties_data)) {
        for (const [author, poems] of Object.entries(authors)) {
          poems.forEach(p => {
            p.stIdx = stIdx;
            p.globalIdx = ALL_POEMS.length;
            ALL_POEMS.push(p);
          });
        }
      }
    });

    let currentModalPoemIdx = 0;

    function getPoemMeta(title, author) {
      const keyCombo = title + '_' + author;
      if (POEM_META.poem_explanations[keyCombo]) return POEM_META.poem_explanations[keyCombo];
      if (POEM_META.poem_explanations[title]) return POEM_META.poem_explanations[title];
      return {
        trans: "此首詩作文字精練雅正，意境深遠，為古典詩詞之典範。",
        explain: "此篇收錄於《長安文選集》，引導學童由淺入深體會古典漢語的聲韻節奏與文學意境。"
      };
    }

    function getAuthorBio(author) {
      if (POEM_META.author_bios[author]) return POEM_META.author_bios[author];
      return "中國古典文學名家，其傳世之作情思深遠，流傳百代。";
    }

    function openPoemModal(idx) {
      if (idx < 0 || idx >= ALL_POEMS.length) return;
      currentModalPoemIdx = idx;
      const p = ALL_POEMS[idx];
      const st = STATIONS[p.stIdx];
      const meta = getPoemMeta(p.title, p.author);
      const bio = getAuthorBio(p.author);

      document.getElementById('pm-grade-badge').innerText = p.grade + '・' + st.stage + '・' + st.landmark;
      document.getElementById('pm-seq-badge').innerText = p.semester + ' 第' + p.num + '首';
      document.getElementById('pm-title').innerText = '〈' + p.title + '〉';
      document.getElementById('pm-author').innerText = '【' + p.dynasty + '】' + p.author;
      
      stopPoemSpeech();
      const isZhuyin = (p.grade === '一年級' || p.grade === '二年級' || p.grade === '三年級');
      const linesEl = document.getElementById('pm-lines');
      const titleEl = document.getElementById('pm-title');
      const fontBadgeEl = document.getElementById('pm-font-badge');

      // Calculate longest line character count to ensure 100% same line without wrap
      const maxLineLen = Math.max(...p.content.map(l => l.length));

      if (isZhuyin) {
        linesEl.classList.add('zhuyin-mode');
        titleEl.classList.add('zhuyin-mode');
        if (maxLineLen >= 15) {
          linesEl.style.fontSize = '21.5px';
          linesEl.style.letterSpacing = '0.5px';
        } else {
          linesEl.style.fontSize = '24.5px';
          linesEl.style.letterSpacing = '1px';
        }
        if (fontBadgeEl) {
          fontBadgeEl.innerText = '🔤 芫荽注音體';
          fontBadgeEl.style.background = 'rgba(39, 174, 96, 0.25)';
          fontBadgeEl.style.borderColor = '#27ae60';
          fontBadgeEl.style.color = '#2ecc71';
        }
      } else {
        linesEl.classList.remove('zhuyin-mode');
        titleEl.classList.remove('zhuyin-mode');
        // Standard Iansui (Grades 4, 5, 6, e.g. 〈錦瑟〉): generous large font size
        if (maxLineLen >= 18) {
          linesEl.style.fontSize = '25.5px';
          linesEl.style.letterSpacing = '1.8px';
        } else {
          linesEl.style.fontSize = '28.5px';
          linesEl.style.letterSpacing = '2.5px';
        }
        if (fontBadgeEl) {
          fontBadgeEl.innerText = '🔤 芫荽體';
          fontBadgeEl.style.background = 'rgba(178, 136, 80, 0.25)';
          fontBadgeEl.style.borderColor = '#b28850';
          fontBadgeEl.style.color = '#ffd166';
        }
      }

      const linesHtml = p.content.map((line, lIdx) => `<div class="pm-line-item" id="pm-line-${lIdx}">${line}</div>`).join('');
      linesEl.innerHTML = linesHtml;

      const noteEl = document.getElementById('pm-note');
      if (p.note) {
        noteEl.innerText = '※ 注釋：' + p.note;
        noteEl.style.display = 'inline-block';
      } else {
        noteEl.style.display = 'none';
      }

      document.getElementById('pm-trans').innerText = meta.trans;
      document.getElementById('pm-explain').innerText = meta.explain;
      document.getElementById('pm-author-title').innerText = '【作者簡介：' + p.author + '】';
      document.getElementById('pm-author-bio').innerText = bio;

      document.getElementById('pm-indicator').innerText = (idx + 1) + ' / ' + ALL_POEMS.length;
      document.getElementById('pm-prev-btn').disabled = (idx === 0);
      document.getElementById('pm-next-btn').disabled = (idx === ALL_POEMS.length - 1);

      document.getElementById('poem-modal').classList.add('open');
      playSound('fly');
    }

    function closePoemModal() {
      stopPoemSpeech();
      document.getElementById('poem-modal').classList.remove('open');
    }

    function onPoemModalBackdropClick(e) {
      if (e.target === document.getElementById('poem-modal')) {
        closePoemModal();
      }
    }

    function navigatePoemModal(delta) {
      const targetIdx = currentModalPoemIdx + delta;
      if (targetIdx >= 0 && targetIdx < ALL_POEMS.length) {
        openPoemModal(targetIdx);
      }
    }

    // Keyboard support for Poem Modal
    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('poem-modal');
      if (modal && modal.classList.contains('open')) {
        if (e.key === 'Escape') {
          closePoemModal();
        } else if (e.key === 'ArrowLeft') {
          navigatePoemModal(-1);
        } else if (e.key === 'ArrowRight') {
          navigatePoemModal(1);
        }
      }
    });

  
    // =========================================================================
    // CLASSICAL POETRY SPEECH RECITATION ENGINE (Web Speech API)
    // =========================================================================
    let speechSynth = window.speechSynthesis;
    let speechVoice = null;
    let isPoemSpeaking = false;
    let speechQueueTimers = [];
    let cardSpeakingIdx = -1;

    function initSpeechVoices() {
      if (!speechSynth) return;
      const voices = speechSynth.getVoices();
      speechVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'zh_TW') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('HsiaoChen') || v.name.includes('YunJhe')))
        || voices.find(v => v.lang === 'zh-TW' || v.lang === 'zh_TW')
        || voices.find(v => v.lang.startsWith('zh'))
        || voices.find(v => v.name.toLowerCase().includes('chinese') || v.name.toLowerCase().includes('taiwan'))
        || null;
    }

    if (speechSynth) {
      if (speechSynth.onvoiceschanged !== undefined) {
        speechSynth.onvoiceschanged = initSpeechVoices;
      }
      initSpeechVoices();
    }

    function stopPoemSpeech() {
      if (speechSynth) {
        speechSynth.cancel();
      }
      speechQueueTimers.forEach(t => clearTimeout(t));
      speechQueueTimers = [];
      isPoemSpeaking = false;
      cardSpeakingIdx = -1;

      // Reset modal UI
      const btn = document.getElementById('pm-speech-btn');
      const waves = document.getElementById('pm-speech-waves');
      const text = document.getElementById('pm-speech-text');
      const icon = document.getElementById('pm-speech-icon');
      if (btn) btn.classList.remove('speaking');
      if (waves) waves.style.display = 'none';
      if (text) text.innerText = '經典吟誦朗讀';
      if (icon) icon.innerText = '🔊';

      // Remove active line highlights
      document.querySelectorAll('.pm-line-item').forEach(el => el.classList.remove('reading-active'));

      // Reset card listen buttons
      document.querySelectorAll('.card-listen-btn').forEach(btn => {
        btn.classList.remove('speaking');
        btn.innerHTML = '🔊 吟誦';
      });
    }

    function speakUtterance(text, rate = 0.84, pitch = 1.0) {
      return new Promise((resolve) => {
        if (!speechSynth) { resolve(); return; }
        const utter = new SpeechSynthesisUtterance(text);
        if (speechVoice) utter.voice = speechVoice;
        utter.lang = speechVoice ? speechVoice.lang : 'zh-TW';
        utter.rate = rate;
        utter.pitch = pitch;
        utter.onend = () => resolve();
        utter.onerror = () => resolve();
        speechSynth.speak(utter);
      });
    }

    async function startPoemSpeech(poem) {
      stopPoemSpeech();
      if (!speechSynth) {
        alert("您的瀏覽器暫不支援語音合成功能");
        return;
      }

      isPoemSpeaking = true;
      const btn = document.getElementById('pm-speech-btn');
      const waves = document.getElementById('pm-speech-waves');
      const text = document.getElementById('pm-speech-text');
      const icon = document.getElementById('pm-speech-icon');
      if (btn) btn.classList.add('speaking');
      if (waves) waves.style.display = 'inline-flex';
      if (text) text.innerText = '停止吟誦';
      if (icon) icon.innerText = '⏹';

      // 1. Read Title and Author with steady introductory cadence
      const introText = poem.title + '。' + poem.dynasty + '，' + poem.author + '。';
      await speakUtterance(introText, 0.86, 1.05);

      if (!isPoemSpeaking) return;
      await new Promise(r => {
        const t = setTimeout(r, 450);
        speechQueueTimers.push(t);
      });

      // 2. Read each line sequentially with cadence pause & highlight
      const lineEls = document.querySelectorAll('.pm-line-item');

      for (let i = 0; i < poem.content.length; i++) {
        if (!isPoemSpeaking) break;

        lineEls.forEach((el, idx) => {
          if (idx === i) el.classList.add('reading-active');
          else el.classList.remove('reading-active');
        });

        const line = poem.content[i];
        await speakUtterance(line, 0.82, 1.0);

        if (!isPoemSpeaking) break;

        // Classical pause between lines (480ms)
        await new Promise(r => {
          const t = setTimeout(r, 480);
          speechQueueTimers.push(t);
        });
      }

      // Finish cleanly
      stopPoemSpeech();
    }

    function togglePoemSpeech() {
      if (isPoemSpeaking) {
        stopPoemSpeech();
      } else {
        const p = ALL_POEMS[currentModalPoemIdx];
        if (p) startPoemSpeech(p);
      }
    }

    async function playQuickCardSpeech(globalIdx) {
      if (isPoemSpeaking && cardSpeakingIdx === globalIdx) {
        stopPoemSpeech();
        return;
      }
      const p = ALL_POEMS[globalIdx];
      if (!p) return;

      stopPoemSpeech();
      cardSpeakingIdx = globalIdx;
      isPoemSpeaking = true;

      const cardBtn = document.getElementById('card-spk-' + globalIdx);
      if (cardBtn) {
        cardBtn.classList.add('speaking');
        cardBtn.innerHTML = '⏹ 停止';
      }

      await speakUtterance(p.title + '。' + p.author + '。', 0.86);
      for (let i = 0; i < p.content.length; i++) {
        if (!isPoemSpeaking) break;
        await speakUtterance(p.content[i], 0.82);
        if (!isPoemSpeaking) break;
        await new Promise(r => {
          const t = setTimeout(r, 450);
          speechQueueTimers.push(t);
        });
      }

      stopPoemSpeech();
    }

  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js">
    // =========================================================================
